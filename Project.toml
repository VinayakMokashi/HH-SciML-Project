# =============================================================================
#  [compat] -- pins the released software stack.
# =============================================================================
#  paper/main.tex (Reproducibility) states "The software stack was Julia 1.6.7",
#  and
#  src/hh_core.jl:14 depends on 1.6.7 dispatch behaviour in prose. Nothing here
#  said so in machine-readable form: Manifest.toml is in the pre-1.7 format and
#  carries no julia_version key, so a reader on 1.10 got no warning at all and
#  Pkg silently re-resolved the whole dependency graph. The julia entry below
#  makes that mismatch a resolver error instead of a silent divergence.
#
#  The package pins are the EXACT versions recorded in the committed
#  Manifest.toml, transcribed rather than chosen, so [compat] and the manifest
#  cannot drift apart. Do not bump one without re-resolving AND re-running the
#  sweep that produced results/ -- the reported numbers are tied to this stack.
#
#  Stdlibs (LinearAlgebra, Random, Statistics) are intentionally absent: they
#  carry no version in this manifest and are supplied by the julia pin.
[compat]
julia = "~1.6.7"
CSV = "=0.10.15"
ComponentArrays = "=0.15.17"
DataDrivenDiffEq = "=1.3.1"
