# ===========================================================================
# BLOCK 15 - AGGRESSIVE-RETRAIN NEGATIVE CONTROL AT THE PHYSIOLOGICAL gCa.
# Source: identifiability/gca04_retrain_control.csv
# (scripts/gca04_retrain_control.py, on results/retrain_gca04_20k/).
#
# This control did not exist. retrain_gca2_20k.jl retrained gCa=2.0 only and then
# COPIED the baseline gCa=0.4 probe into its output tree, making the "after"
# negative-control row byte-identical to the "before" one -- which reads like a
# replication while being one number in two directories. The script is now
# parameterised (defaults unchanged) and skips that copy when gCa != 2.0, and a
# genuine gCa=0.4 run at Adam 20000 / BFGS 1000 exists.
#
# READ THE DOMAINS TOGETHER OR THE RESULT IS MISSTATED:
#   hull:       a_hat -0.372 -> -1.341, R^2 0.688 -> -0.331. Wrong-signed before
#               AND after, and markedly worse after.
#   traj-train: a_hat -0.061 -> +0.021. Nominally a sign change, but BOTH are
#               indistinguishable from zero against a true +0.4. Do NOT report
#               this as the closure recovering the sign; report it as the
#               closure learning essentially nothing about the current at the
#               physiological conductance, under either budget.
# ===========================================================================

  - name: GcaFourRetrainAHatBefore
    source: identifiability/gca04_retrain_control.csv
    filter: {case: before, domain: hull}
    emit: value
    column: a_hat
    round: 3
    # raw=-0.372012 (true +0.4). Matches the published SymbolicAHatNegControl.

  - name: GcaFourRetrainAHatAfter
    source: identifiability/gca04_retrain_control.csv
    filter: {case: after, domain: hull}
    emit: value
    column: a_hat
    round: 3
    # raw=-1.341357 (true +0.4)
    note: >-
      The physiological failure does not improve under a fourfold budget; the
      conductance moves further from the truth and stays wrong-signed. Pair with
      GcaFourRetrainRTwoAfter, which collapses below zero.

  - name: SymbolicAHatTrajTrainPointFour
    source: identifiability/gca04_retrain_control.csv
    filter: {case: before, domain: traj-train}
    emit: value
    column: a_hat
    round: 3
    # raw=-0.060706 (true +0.4), baseline budget, seed 1111
    note: >-
      The gCa=0.4 closure estimate on the SUPERVISED TRAJECTORY, i.e. the same
      domain the text quotes everywhere else. Pair it with
      SymbolicAHatNegControl (-0.372), which is the same quantity on the convex
      hull. Neither is usable: one is wrong-signed and large, the other is
      indistinguishable from zero against a true +0.4. Quote whichever domain the
      surrounding sentence is using, and SAY which - the two differ by a factor
      of six and a reader who sees only one will think the other is a typo.

  - name: ParamFitChiSqPerPointPointFour
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 0.4}
    aggregate: {over: seed, stats: [mean], ddof: 1, dropna: true}
