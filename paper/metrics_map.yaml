# ===========================================================================
# BLOCK 13 - NEURAL ODE AT A MATCHED BUDGET (review point 5a).
# Source: node_parity/node_parity_summary.csv
# (scripts/summarize_node_parity.py). Pre-aggregated; filter on the short `key`
# column, never on `model` (that column contains parentheses and runs of
# spaces).
#
# Three rows attribute the published baseline's failure:
#   published_time  Adam 3000, 6 states + raw t
#   parity_time     Adam 5000, 6 states + raw t   -> the BUDGET effect
#   parity_auto     Adam 5000, 6 states only      -> the ARCHITECTURE effect
#
# *** THE BUDGET EXPLAINS NOTHING; THE ARCHITECTURE EXPLAINS EVERYTHING. ***
# Any restored claim that the neural ODE "diverges", or that the comparison is
# "impossible versus routine", is unsupported: with the time input removed, 4 of
# 5 seeds forecast with finite error and exactly correct spike counts.
# ===========================================================================

  - name: NodeParityAutoVRmseMedian
    source: node_parity/node_parity_summary.csv
    filter: {key: parity_auto, metric: V_rmse}
    emit: value
    column: median
    round: 2
    # raw median=16.88; mean=73.19 sd=124.0; per-seed 34.5/8.7/11.1/294.8/16.9
    note: >-
      *** QUOTE THE MEDIAN, NOT THE MEAN. *** The mean (73.2 +/- 124) is
      dominated by seed 4444, the single seed that still blows up. Four of five
      seeds land between 8.7 and 34.5 mV with exactly correct spike counts. The
      honest summary is "usually finite, occasionally catastrophic", and the
      median plus the per-seed range says that; the mean hides it.

  - name: NodeParityAutoGateRmseMedian
    source: node_parity/node_parity_summary.csv
    filter: {key: parity_auto, metric: gate_rmse_mean}
    emit: value
    column: median
    round: 3
    # raw median=0.10051358864421904; mean=0.7779 sd=1.4956 n=5;
    # per-seed 0.2341/0.0398/0.0651/3.4499/0.1005
    note: >-
      Gate RMSE of the REPAIRED (autonomous) neural ODE. This is the only NODE
      row that can be compared like-for-like against the UDE gate column, which
      is why the cell is filled rather than dashed. *** QUOTE THE MEDIAN, NOT
      THE MEAN, for exactly the reason given under NodeParityAutoVRmseMedian:
      *** seed 4444, the one seed that still blows up, contributes 3.4499 of the
      five values and drags the mean to 0.778 with an sd of 1.496 - an sd nearly
      twice the mean, which is not an error bar. Guard G2 (node-no-meanstd)
      scopes to the two TIME-INDEXED rows, whose integrations diverge, so this
      row is outside that guard; its single bad seed makes the median the honest
      summary anyway.

  - name: NodeParityAutoRollout
    source: node_parity/node_parity_summary.csv
    filter: {key: parity_auto, metric: rollout_horizon_ms}
