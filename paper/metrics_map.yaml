# =============================================================================
# DO NOT MACRO THESE — guarded or uninformative
# -----------------------------------------------------------------------------
# A macro is an invitation to quote. These numbers are real and extractable, and
# quoting them would still be wrong. They are listed here so that "why isn't
# this a macro?" has a written answer and nobody re-adds them.
#
#  1. R2_ens = 0.997333 (results/symbolic/learned_calcium_equation.txt line 8)
#     UNINFORMATIVE. It moved 0.997333 → 0.997341 — the FIFTH DECIMAL — while
#     the per-seed R² it supposedly summarises COLLAPSED 0.984 → 0.845 in the
#     retrain. A statistic blind to that collapse cannot headline recovery
#     quality. It is r2(pooled symbolic fit, pooled TRUE current) on the shared
#     hull grid, so it mostly scores "does an s²(aV+b) form fit gCa·s²(V−ECa)",
#     which it does almost perfectly BY CONSTRUCTION. It is also measured on a
#     different domain (hull grid) than the per-seed R² (trajectory) — not a
#     like-for-like pair. USE INSTEAD: SymbolicRTwoCondTrue (0.984 ± 0.014).
#
#  2. The ensemble a = 1.596 / b = −259.3 as a "second estimate" or a
#     "corroborating pooled fit". ALGEBRAICALLY THE SAME NUMBER as the per-seed
#     mean, not a different estimator. All 5 seeds share gCa=2.0 ⇒ the same clean
#     trajectory ⇒ the same hull ⇒ the same grid ⇒ THE SAME DESIGN MATRIX.
#     Stacking an identical Φ five times gives (5ΦᵀΦ)⁻¹Φᵀ(Σyᵢ) = mean(βᵢ) exactly
#     — confirmed to 6 dp in both output files. Reporting per-seed mean and
#     "ensemble" as two agreeing estimates is reporting ONE NUMBER TWICE and
#     manufacturing false corroboration. The ONLY genuinely different ensemble
#     quantity is Erev_ens = −mean(b)/mean(a) = 162.5 mV, because a ratio of
#     means ≠ a mean of ratios; that is the code's actual (valid) point and the
#     honest framing is "reversal potential computed from the mean coefficients
#     rather than as a mean of per-seed ratios" — NOT "an ensemble fit".
#     (If the paper quotes Erev_ens, it is a numok, not a macro — see below.)
#
#  3. NODE forecast V_rmse as a headline. NodeForecastVRmse exists above but is
#     guarded (G2): traceable if it appears in an appendix, never a headline.
#     USE INSTEAD: NodeForecastRollout (0.55 ± 0.65 ms).
#
#  4. UDE rollout as "70 ms". G1. UdeForecastRollout emits "\ge 70" and there is
#     no non-censored variant to reach for.
#
#  5. The retrain's gCa=0.4 row (any column). A byte-identical copy of the
#     baseline's — the negative control was never retrained.
#
#  6. common_eval_* from ablation_noise.csv or ablation_gca.csv. Populated on the
#     single shared-baseline row; empty elsewhere. Only ablation_window.csv has a
#     real common-eval series.
#
# =============================================================================
# NOT IN ANY CSV — these are NOT macro candidates. Handle as numok.
# -----------------------------------------------------------------------------
# The metrics map extracts from tabular results. These live in code or in prose
# output. A macro for them would fake a provenance chain that does not exist:
# the generated `% source=... column=... raw=...` comment would be a lie, and the
# number would not update if the code changed. They must go in the .tex with an
# explicit `% numok: <reason>` naming the FILE AND LINE, which is exactly the
# mechanism check_numbers.py provides for non-tabular facts. numok is not a
# loophole — it is a citation to a source that is not a table.
#
#   Ensemble fit (learned_calcium_equation.txt line 8 ONLY; in no CSV):
#     a_ens=1.595550, b_ens=−259.3324, Erev_ens=162.5348 mV, R2_ens=0.997333,
#     pooled fit points=22120 (of 5x6400=32000 grid points surviving the hull
#     mask). Retrain twin: Erev_ens=171.2706. Reconstructible by re-running the
#     pooled least squares on the raw grid probes (recon/results.md §9.6 did so
#     and matched the .txt exactly). If more than Erev_ens is quoted, prefer
#     teaching objective3_symbolic.jl to emit a CSV over parsing the .txt.
#     Then these become real macros. Until then: numok.
#     % numok: ensemble reversal potential, results/symbolic/learned_calcium_equation.txt:8
#
#   Iteration budgets (code):
#     UDE Adam 5000 / BFGS 300, NODE Adam 3000 / BFGS 300
#       — experiments_runner.jl:30-31
#     Retrain Adam 20000 / BFGS 1000 — retrain_gca2_20k.jl:40-41
#     Adam LR 1e-2 for both models.
#     % numok: training budget, experiments_runner.jl:30
#
#   Architecture (code, src/experiment.jl):
#     UDE closure 2→16(tanh)→16(tanh)→1, 337 params, inputs [V/100, s].
#     NODE 7→64(tanh)→LN→64(tanh)→LN→6, ~5318 params, input = 6 normalized
#     states ⊕ RAW t.
#     The parameter counts are DERIVED, not printed anywhere — recompute and cite
#     the layer spec, do not transcribe a count you have not re-derived.
#     % numok: architecture, src/experiment.jl:136-140
#
