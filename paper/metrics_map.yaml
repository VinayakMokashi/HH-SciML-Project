      mean AND the denominator. Quoting NODE 1.27 ms beside the UDE's 0.0 ± 0.0
      (n=5) without this counter would materially FLATTER a model that diverges
      within one sample of the forecast start. Either report n inline via this
      macro or drop the metric for NODE entirely; the second is cleaner. This
      macro exists so the choice is explicit rather than accidental.

