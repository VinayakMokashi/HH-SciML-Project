# =============================================================================
# metrics map — Hodgkin–Huxley SciML paper (the worked example)
# =============================================================================
#
# Phase 3 (Evidence) artifact. Maps every number the HH paper quotes to a cell
# in a real results file. Nothing here was hand-transcribed: every value in the
# `# raw=` comments was recomputed from the CSVs with pandas and matched.
#
# HOW TO RUN (from the skill root; Windows, python 3.12.3, `python` NOT `python3`).
# ONE LINE — the default shell here is PowerShell 5.1, where a trailing `\` is
# NOT a line continuation (that is `` ` ``). Verified to exit 0 and write 120
# macros from the 36 entries below:
#
#   python scripts/extract_metrics.py --map examples/hh-sciml/metrics_map.yaml --results-root "d:/SciML/bootcamp/Research Project/HH-SciML-Project/results" --out paper/generated/metrics.tex
#
# `--results-root` OVERRIDES `defaults.results_root` outright (extract_metrics.py
# load_map: `results_root_override or defaults.get(...)`) — it does not resolve
# against it. The `results_root: results` default below is what you get when the
# flag is omitted and the results tree sits inside the skill repo. It does NOT
# for this example: the HH results live in a different repo, so the flag is
# mandatory here. Every `source:` is relative to whichever root wins.
#
# Then in the preamble: \input{generated/metrics.tex}
# Then every number in the body is \valSomething. `check_numbers.py` enforces it.
#
# -----------------------------------------------------------------------------
# THREE SCHEMAS, NOT ONE — read this before adding an entry
# -----------------------------------------------------------------------------
# The HH results tree carries three incompatible table schemas. An entry written
# against the wrong one silently extracts the wrong cell or nothing:
#
#   1. TIDY  — metrics_all.csv: 9 cols
#              (model,observed,gCa,noise_level,t_train_end,seed,window,metric,value)
#              The value column is literally named `value`. Filters MUST pin all
#              of gCa/noise_level/t_train_end/seed or they pool ablation points
#              into the baseline (the grid is a star design, not a cross).
#
#   2. WIDE  — metrics_baseline*.csv, ablation_*.csv: one row per axis value,
#              metric encoded in the COLUMN NAME (`forecast_ICa_rmse_norm`).
#              metrics_baseline_multiseed.csv is the pre-aggregated variant
#              (mean/std/n_seeds columns) and is the preferred headline source:
#              it matches a direct recomputation from metrics_all.csv to ~1e-15.
#
#   3. BESPOKE — retrain_gca2_20k/metrics_retrain.csv: 7 cols
#              (seed,final_loss,bfgs_ok,train_V_rmse,forecast_V_rmse,
#               train_ICa_rmse,forecast_ICa_rmse)
#              *** WARNING: this is neither of the above. *** No `window`
#              column (the window is a `train_`/`forecast_` column-name prefix),
#              no `metric` column, no gate/rollout/ICa_rmse_norm/common_eval
#              columns at all. It therefore needs its own entries (the Retrain*
#              block below) and CANNOT be diffed against
#              metrics_baseline_multiseed.csv column-for-column. Every
#              before/after pair in this file was constructed by hand-matching
#              the semantics, not the schema. Do not add a Retrain* macro for a
#              quantity that block does not carry — it does not exist.
#
# -----------------------------------------------------------------------------
# MACRO NAMING — hard constraint, verify before you add anything
# -----------------------------------------------------------------------------
# LaTeX \newcommand names are letters ONLY. `\valFigure2` is a parse error, not
# a style preference. extract_metrics.py enforces ^[A-Za-z][A-Za-z0-9]*$, which
# is laxer than TeX — so the regex passing does NOT mean the macro will compile.
# Spell every number out: PointFour, One, Two, Four, Fifteen, Twenty, Thirty,
# Forty, Fifty, and RTwo for R². Every name in this file is alphabetic-only;
# keep it that way.
#
# -----------------------------------------------------------------------------
# `column:` vs `columns:` — the one thing that trips every new entry
# -----------------------------------------------------------------------------
# The contract §6 `aggregate:` example is on the TIDY table, where the aggregated
# column is implicitly named `value`. The symbolic and retrain tables are WIDE, so
# the column must be named explicitly. The extractor spells the two cases with two
# DIFFERENT keys (extract_metrics.py `_parse_macro`), and mixing them is a hard
# schema error, not a warning:
#
#   column:  <col>                     SINGULAR. The column to READ. Use for
#                                      emit value / ge / range / list, AND for
#                                      emit mean_std + aggregate. Defaults to
#                                      `value` (the tidy column) when omitted.
#   columns: {mean:…, std:…, n:…}      PLURAL. ONLY for emit mean_std reading
#                                      PRE-AGGREGATED stats off one row (i.e.
#                                      metrics_baseline_multiseed.csv). Keys are
#                                      restricted to mean/std/n — there is no
#                                      `columns: {value: …}`.
#
# Other rules the extractor enforces, all of which bite here:
#  - emit mean_std takes EITHER `columns` (read precomputed) OR `aggregate`
#    (compute now) — never both.
#  - `columns` on any emit other than mean_std is rejected; use `column`.
#  - `censored_at` is legal ONLY on emit ge, and emit ge REQUIRES it.
#  - emit ge additionally verifies every matched value sits ON the bound, so
#    UdeForecastRollout would fail loudly if a seed ever came in under the cap.
#  - unknown keys are rejected rather than ignored, ANYWHERE — including in
#    `defaults`, which accepts `results_root` and nothing else.
#  - a filter matching >1 row without `aggregate` is an error, not a silent
#    first-row pick. That is the whole point of the script.
#
# =============================================================================

defaults:
  # `defaults` accepts results_root ONLY (extract_metrics.py: DEFAULTS_KEYS).
  # There is no defaults.round and no defaults.aggregate — unknown keys are a
  # hard schema error, not a warning. So `round:` is spelled per entry (the
  # extractor's own default is 3 dp when omitted), and every aggregating entry
  # repeats `ddof: 1, dropna: true` in full.
  # Those two are not decoration: Julia `Statistics.std` is the SAMPLE std, and
  # the runner's agg() helper (experiments_runner.jl:199-200) drops non-finite
  # BEFORE averaging. Reproduce both or (a) stds come out too small and (b) the
  # NODE spike metric returns NaN instead of its n=2 mean.
  results_root: results   # OVERRIDDEN by --results-root when given; see header

macros:

  # ===========================================================================
  # BLOCK 1 — headline accuracy, baseline point (gCa=2.0, noise=0.02,
  #           t_train_end=30.0), mean ± std over 5 seeds.
  # Source: metrics_baseline_multiseed.csv (pre-aggregated; 32 rows).
  # NOTE: this file contains ONLY window ∈ {train, forecast}. There are no
  # common_eval rows here — for those go to ablation_window.csv (Block 4).
  # Every seed redraws BOTH the network init AND the OU noise realization, so
  # "± std over seeds" is a joint spread. The paper must say so; calling it an
  # init spread is inaccurate and the two sources cannot be separated.
  # ===========================================================================

  - name: NodeForecastVRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: NODE, observed: full, window: forecast, metric: V_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 0
    # raw mean=3951.178018885416 std=3561.340803031814 n=5
    note: >-
      *** GUARDED — see claim-guards.md G2. THIS MACRO MUST NOT BE A HEADLINE. ***
      It exists so that if the number appears at all (e.g. an appendix table of
      raw metrics) it is traceable, NOT so that it can be quoted as
      "3951 ± 3561 mV". Per-seed: 4122.7 / 229.1 / 1134.0 / 5056.6 / 9213.4 — a
      40x spread; the distribution is nowhere near normal and the std exceeds
      any meaningful voltage scale. This is a diverged integration, and
      rmse_safe (src/metrics.jl:20-25) drops non-finite pairs, so it is the RMSE
      of the *finite part* of a blown-up solve, over an unreported subset of
      timesteps. The honest headline for NODE failure is NodeForecastRollout.
      Prose: "diverges (V RMSE 10^2–10^4 mV across seeds)".

  - name: UdeForecastVRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: V_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.24523933188134714 std=0.028375840021892113 n=5  -> 0.245 ± 0.028
    note: >-
      THE headline UDE forecast accuracy. Full-state observation, 358 forecast
      points (t > 30 ms) of one uninterrupted rollout from t=0 — the model is
      never re-initialized at t_train_end, so this is extrapolation error, not
      one-step error. Scored against the CLEAN trajectory. Pair with
      UdeTrainVRmseVsNoisy for the noise floor.

  - name: UdeVoltageForecastVRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: voltage, window: forecast, metric: V_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.2635508680094284 std=0.11760231838630762 n=5  -> 0.264 ± 0.118
    note: >-
      Voltage-only observation: the loss selects row 1 only
      (make_ude_loss, experiment.jl:157-172); the gates are hidden from the
      OBJECTIVE, not from the solver (u0 is the full true 6-state IC in every
      run). Say "voltage-only observation in the loss", never "only V is known".
      EQUIVALENCE CLAIM ONLY — see claim-guards.md: 0.264 vs 0.245 against stds
      of 0.118/0.028 at n=5, with no test run anywhere in the codebase. Write
      "matches full-state observation to within seed noise". Do NOT write
      "voltage-only is slightly worse". Note also there are NO common_eval rows
      for observed=voltage, so that comparison cannot be made at all.

  - name: UdeForecastGateRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: gate_rmse_mean}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 5
    # raw mean=0.000951766817970978 std=0.00017026484222479465 n=5 -> 0.00095 ± 0.00017
    note: >-
      Mean of the five per-gate RMSEs (m,h,n,p,s) — an arithmetic MEAN OF RMSEs,
      not a pooled RMSE (src/metrics.jl); each gate is weighted equally
      regardless of dynamic range. Describe it as such. round: 5, NOT 4: the
      voltage-only twin UdeVoltageForecastGateRmse rounds to 5 and sits in the
      SAME column of Table 1, so round: 4 here printed one quantity at two
      precisions (0.0010 +/- 0.0002 stacked above 0.00106 +/- 0.00043). Do not
      drop below 5 either, because the
      value is ~1e-3 and 3 dp would render it as 0.001 ± 0.000.

  - name: UdeForecastICaRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: ICa_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=1.189072098980375 std=0.20829298482831607 n=5  -> 1.189 ± 0.208
    note: >-
      Hidden-calcium-current recovery error, µA/cm². UDE ONLY — ICa_* rows do
      not exist for NODE (no calcium closure), so there is no baseline
      comparison for this metric and none should be implied. CRITICAL: this is a
      FUNCTION-APPROXIMATION error, not a rollout error. ICa_nn is probed at the
      true CLEAN (V,s) (experiment.jl:391-393), decoupled from trajectory error,
      whereas V_rmse comes from a free 100 ms rollout. Different objects — do
      not narrate them as one.

  - name: UdeVoltageForecastICaRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: voltage, window: forecast, metric: ICa_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=1.3092265677039077 std=0.44677450570074734 n=5  -> 1.309 ± 0.447
    note: >-
      Voltage-only twin of UdeForecastICaRmse. Equivalence claim only:
      Δ = 0.12 µA/cm² against a pooled std ≈ 0.35 at n=5. See the guard on
      UdeVoltageForecastVRmse.

  - name: UdeForecastICaRmseNorm
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: ICa_rmse_norm}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.1403411215254637 std=0.02458393492014376 n=5  -> 0.140 ± 0.025
    note: >-
      ICa_rmse / std(ICa_true) WITHIN THAT WINDOW (src/metrics.jl:151-153). The
      normalizer is recomputed per window, so the train and forecast values use
      different denominators and are not comparable to each other. Its value is
      as the unit-free scale that makes the gCa sweep (Block 3) interpretable:
      >1 means the closure's error exceeds the signal's own variation. This is
      also the seed-spread yardstick (±0.025) for judging which single-seed
      ablation gaps in Block 3 are real.

  - name: UdeVoltageForecastICaRmseNorm
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: voltage, window: forecast, metric: ICa_rmse_norm}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.15452244233133955 std=0.05273089432742834 n=5  -> 0.155 ± 0.053
    note: "Voltage-only twin of UdeForecastICaRmseNorm. Equivalence claim only."

  - name: UdeTrainVRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: train, metric: V_rmse}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.14750473251115578 std=0.04544861830300034 n=5  -> 0.148 ± 0.045
    note: >-
      Train-window (t ≤ 30 ms, 154 points) V RMSE vs the CLEAN trajectory. Quote
      beside UdeForecastVRmse to show the train→forecast gap is small (0.148 →
      0.245) — the UDE is not memorizing the window. Contrast NODE, which is
      9.45 ± 3.21 on train and diverges on forecast.

  - name: UdeTrainVRmseVsNoisy
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: train, metric: V_rmse_vs_noisy}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 3
    # raw mean=0.48134884129865074 std=0.012359910532320035 n=5  -> 0.481 ± 0.012
    note: >-
      THE NOISE FLOOR — the load-bearing companion to UdeTrainVRmse. Same
      prediction, scored against the NOISY training target instead of the clean
      truth. A model that recovered the clean signal exactly would score ≈ the
      noise std here, not 0. That UdeTrainVRmse (0.148, vs clean) is well BELOW
      UdeTrainVRmseVsNoisy (0.481, vs noisy) is the direct evidence the UDE
      fit the signal and not the noise. Without this macro the reader cannot
      tell whether 0.148 mV is good.

  # ===========================================================================
  # BLOCK 2 — rollout horizon. The censoring block. Read G1 before touching.
  # ===========================================================================

  - name: NodeForecastRollout
    source: metrics_baseline_multiseed.csv
    filter: {model: NODE, observed: full, window: forecast, metric: rollout_horizon_ms}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 2
    # raw mean=0.5479452054794521 std=0.6549197859366547 n=5  -> 0.55 ± 0.65
    note: >-
      *** THE HONEST NODE HEADLINE — use this, not NodeForecastVRmse (G2). ***
      Milliseconds until |V_pred − V_true| exceeds 10 mV for a sustained ≥1 ms.
      dt ≈ 0.196 ms, so 0.55 ms means the black-box Neural ODE leaves the tube
      within ONE TO EIGHT SAMPLES; per-seed 0.783/0.0/0.391/1.566/0.0, and the
      two 0.0 seeds breached at the very first forecast sample. Uncensored (far
      from the 70 ms cap), physically interpretable, and it states the failure
      without the spurious precision of a diverged RMSE. Not censored ⇒ mean_std
      is legitimate here, unlike UdeForecastRollout.

  - name: UdeVoltageForecastRollout
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: voltage, window: forecast, metric: rollout_horizon_ms}
    emit: ge
    censored_at: 70.0
    column: mean
    round: 0
    # raw mean=70.0 std=0.0 n=5  -> renders "\ge 70"
    note: >-
      *** GUARDED — claim-guards.md G1, exactly as UdeForecastRollout. *** The
      voltage-only twin, added 2026-08-21 because Table 2's "UDE, V only" row was
      printing the FULL-STATE macro in its rollout cell: numerically the same
      censored value, but the cell was not sourced from the voltage-only run and
      would have silently stopped tracking it if the two ever diverged. Same
      censoring caveat: 70.0 is cap_ms, returned when the tube is never breached,
      so it is right-censored and must render with "\ge". Never print a mean +/- SD
      for it; the SD is 0 by construction.

  - name: UdeForecastRollout
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: rollout_horizon_ms}
    emit: ge
    censored_at: 70.0
    column: mean
    round: 0
    # raw mean=70.0 std=0.0 n=5  -> renders "\ge 70"
    note: >-
      *** GUARDED — claim-guards.md G1. emit: ge IS MANDATORY HERE. ***
      70.0 is cap_ms (src/metrics.jl:81-82), returned when the 10 mV tube is
      NEVER breached — a right-censored value, not a measured horizon. It is
      also exactly 100 − 30, i.e. the entire remaining trajectory: the metric is
      saturated for all 5 seeds and cannot discriminate among them. A macro
      emitting "70.0 ± 0.0 ms" asserts zero variance on a number that is
      really "≥ 70 and unknown" — the single most misleading rendering
      available in this results tree. Renders "\ge 70"; the caption must name
      the cap. Same censoring applies to UDE/voltage (also 70.0 ± 0.0); add a
      parallel entry only if the paper quotes it separately.

  # ===========================================================================
  # BLOCK 3 — gCa sweep, SINGLE SEED (1111). *** SUPERSEDED FOR INFERENCE BY
  # BLOCK 12 ***, which runs the same sweep at n=5 with spreads and is what the
  # paper's Fig 5 and every quantitative sentence now cite.
  # Source: ablation_gca.csv (WIDE, 4 rows, axis column `gCa`).
  # These four macros survive for ONE purpose: showing that gCa=2.0 was a
  # CONTROLLED choice rather than a tuned one (claim gca-two-is-a-controlled-
  # choice). Do not quote them as the backbone of the identifiability claim.
  # The old guidance here inferred which gaps were real from a single
  # realisation. That is now MEASURED over five seeds, and it disagrees: only
  # the 1.0→2.0 step clears two pooled SD (2.44); 0.4→1.0 (1.75) and 2.0→4.0
  # (1.32) do NOT. Claim the end-to-end 0.4-vs-4.0 trend, never a single step.
  # Do NOT use ablation_gca.csv's common_eval_* columns for anything: they are
  # populated on the gCa=2.0 row only (inherited from the shared baseline run)
  # and empty on the other three.
  # ===========================================================================

  - name: GcaAblICaNormPointFour
    source: ablation_gca.csv
    filter: {gCa: 0.4}
    emit: value
    column: forecast_ICa_rmse_norm
    round: 3
    # raw=1.1791588919620495  -> 1.179
    note: >-
      gCa = 0.4 (the physiological value), SINGLE SEED. This 1.179 does exceed 1,
      but it is ONE realisation: the same quantity over five seeds is
      0.724 +/- 0.318 (BLOCK 12), which APPROACHES the true current's own
      standard deviation without exceeding it. *** Do not write "the closure's
      error exceeds the current's own variation" anywhere in the paper —
      claims.yaml forbids that phrasing and the five-seed mean does not support
      it. Say it approaches unity, and give the spread. *** The physiological
      setting is still where recovery fails, which remains the reason the main
      setting is the non-physiological gCa=2.0. Single seed (G13).

  - name: GcaAblICaNormOne
    source: ablation_gca.csv
    filter: {gCa: 1.0}
    emit: value
    column: forecast_ICa_rmse_norm
    round: 3
    # raw=0.3325491936637111  -> 0.333
    note: "gCa = 1.0. Single seed (G13). The 0.4→1.0 gap clears the ±0.025 seed spread."

  - name: GcaAblICaNormTwo
    source: ablation_gca.csv
    filter: {gCa: 2.0}
    emit: value
    column: forecast_ICa_rmse_norm
    round: 3
    # raw=0.11229216448147902  -> 0.112
    note: >-
      gCa = 2.0, the paper's main setting. Single seed (G13). Sanity check: this
      is seed 1111 of the same configuration whose 5-seed mean is
      UdeForecastICaRmseNorm = 0.140 ± 0.025 — consistent, and a useful
      cross-check that the ablation row and the multiseed row describe the same
      run. Do not present 0.112 and 0.140 as two different results.

  - name: GcaAblICaNormFour
    source: ablation_gca.csv
    filter: {gCa: 4.0}
    emit: value
    column: forecast_ICa_rmse_norm
    round: 3
    # raw=0.06772530981692793  -> 0.068
    note: >-
      gCa = 4.0. Single seed (G13). The 2.0→4.0 improvement (0.112 → 0.068) is
      within seed noise — quote it as part of the monotone trend, never as a
      standalone difference.

  # ===========================================================================
  # BLOCK 4 — training-window sweep, scored on the SHARED t > 50 ms interval.
  # Source: ablation_window.csv (WIDE, 5 rows, axis column `t_train_end`).
  #
  # *** claim-guards.md G11: use common_eval_*, NEVER forecast_*. ***
  # The forecast window shifts with t_train_end, so forecast_* scores each point
  # on a DIFFERENT interval — confounded by construction. common_eval fixes the
  # interval at t > 50 ms (COMMON_EVAL_START, chosen as the largest training
  # window in the sweep so the interval is unseen for all of them). Same rule for
  # the figure: fig7b_commoneval_ablation_window.png, NOT fig7b_ablation_window.png.
  # ablation_window.csv is the ONLY ablation with all 5 common_eval rows populated.
  #
  # *** claim-guards.md G12: the non-monotonicity is an ARTIFACT. ***
  # 40/50 ms scoring worse than 20/30 ms is a fixed-iteration optimization
  # artifact — every window trains for the same Adam 5000 / BFGS 300 regardless
  # of how many points it must fit, so longer windows are UNDER-OPTIMISED, not
  # intrinsically harder. common_eval removes the shifting-window confound but
  # NOT this one. Any prose or caption using these five macros must state it, or
  # the figure argues the opposite of the truth.
  #
  # Also single-seed (G13): the ±0.028 seed spread at t_train=30
  # (UdeForecastVRmse) is comparable to the 20↔30 and 30↔40 gaps. Only the
  # t_train=15 collapse (1.559, ~7x) is safely outside seed noise.
  # At t_train_end=50, common_eval_* == forecast_* by construction (both index
  # t > 50) — not an independent check at that point.
  # ===========================================================================

  - name: WindowAblCommonEvalVRmseFifteen
    source: ablation_window.csv
    filter: {t_train_end: 15.0}
    emit: value
    column: common_eval_V_rmse
    round: 3
    # raw=1.5586033539127329  -> 1.559
    note: >-
      t_train_end = 15 ms. The one window result that clears seed noise: ~7x
      worse than 20 ms. Claim: below ~20 ms of data the UDE fails to constrain
      the closure. Guards G11 (commoneval), G12 (artifact caveat), G13 (n=1).

  - name: WindowAblCommonEvalVRmseTwenty
    source: ablation_window.csv
    filter: {t_train_end: 20.0}
    emit: value
    column: common_eval_V_rmse
    round: 3
    # raw=0.22523666920122537  -> 0.225
    note: "t_train_end = 20 ms. Guards G11, G12, G13. Gap to 30 ms is within seed noise."

  - name: WindowAblCommonEvalVRmseThirty
    source: ablation_window.csv
    filter: {t_train_end: 30.0}
    emit: value
    column: common_eval_V_rmse
    round: 3
    # raw=0.23608373353853263  -> 0.236
    note: >-
      t_train_end = 30 ms — the baseline window, seed 1111. Guards G11, G12, G13.
      Not the same quantity as UdeForecastVRmse (0.245 ± 0.028): that is the
      forecast window (t > 30) over 5 seeds, this is the common-eval window
      (t > 50) at one seed. Do not conflate them.

  - name: WindowAblCommonEvalVRmseForty
    source: ablation_window.csv
    filter: {t_train_end: 40.0}
    emit: value
    column: common_eval_V_rmse
    round: 3
    # raw=0.3671703369134956  -> 0.367
    note: >-
      t_train_end = 40 ms. *** Worse than 30 ms — G12 artifact, MUST be flagged
      wherever quoted. *** More training data with a fixed iteration budget =
      under-optimisation, not a harder problem.

  - name: WindowAblCommonEvalVRmseFifty
    source: ablation_window.csv
    filter: {t_train_end: 50.0}
    emit: value
    column: common_eval_V_rmse
    round: 3
    # raw=0.4177206252114012  -> 0.418
    note: >-
      t_train_end = 50 ms. G12 artifact (worst of the four non-collapsed
      windows). Additional caveat: at this point common_eval_* == forecast_*
      exactly, since make_split(50.0) and common_eval_indices() select the same
      index set — correct behaviour, but not an independent check.

  # ===========================================================================
  # BLOCK 5 — symbolic recovery, gCa = 2.0. Objective 3, the "before".
  # Source: symbolic/symbolic_recovery_metrics.csv (6 rows: 5 x gCa=2.0 + 1 x gCa=0.4).
  # WIDE per-config schema, so `columns.value` names the column to aggregate.
  # Fit: I_Ca ≈ s²(aV + b) by 2-column OLS, no intercept, on the grid probe
  # masked to the trajectory's (V,s) convex hull. a ↔ gCa (true 2.0),
  # b ↔ −gCa·ECa (true −240.0), Erev = −b/a (true 120.0).
  # Fitting off-trajectory but in-distribution is the methodological crux: the
  # HH limit cycle is a near-1-D loop in (V,s) and is rank-deficient for this fit.
  # ===========================================================================

  - name: SymbolicAHatRange
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    emit: range
    column: a_hat
    round: 3
    # raw min=0.6730558988367701 max=3.094842062703728 n=5  -> renders "0.673--3.095"
    note: >-
      The per-seed span of a_hat, and the number that makes SymbolicAHat's
      "1.60 ± 0.90" legible: the estimates span 4.6x and BRACKET the true 2.0
      rather than concentrating near it. Text mode — renders an en-dash range,
      not math. A SECOND entry over the same column as SymbolicAHat is the
      correct construction: one entry has one `emit:`, and mean_std has already
      spent SymbolicAHat's. The suffix-collision worry is unfounded — only
      `emit: mean_std` appends Mean/Std/N/MeanStd; `emit: range` emits the bare
      name, so this entry generates exactly \valSymbolicAHatRange.

  - name: SymbolicAHat
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: a_hat
    round: 2
    # raw mean=1.595550 std=0.904569 (true a = gCa = 2.0); per-seed span 0.673 → 3.095
    note: >-
      *** THE NEGATIVE RESULT. 1.60 ± 0.90 against a true 2.0 IS NOT A RECOVERY. ***
      The std is 57% of the mean and the per-seed values span 4.6x. Quote it ONLY
      as "order-correct", never as "recovers gCa". The exoneration control that
      makes this a claim about the data rather than the code: the same estimator
      fitted to the TRUE current on the same hull-masked domain returns
      a ≈ 2.0, b ≈ −240 (objective3_symbolic.jl:208-209 `[sanity]`) — so the fit
      machinery is sound and the spread is the NETWORK's non-identifiability.
      Cite that control whenever this macro appears.
      DO NOT also quote the "ensemble" a = 1.596 as a corroborating second
      estimate — it is algebraically the same number (see the DO-NOT-MACRO block).

  - name: SymbolicBHat
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: b_hat
    round: 1
    # raw mean=-259.332393 std=59.501608 (true b = -gCa*ECa = -240.0)
    note: >-
      b ↔ −gCa·ECa, true −240.0. Closer in relative terms than a_hat (8% off)
      but with a 23% std. Same "order-correct, not recovered" framing. round: 1
      because the value is O(10²) — 3 dp would be absurd precision on ±59.5.

  - name: SymbolicRTwoCondTrue
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_cond_true
    round: 3
    # raw mean=0.983586 std=0.014494  -> 0.984 ± 0.014
    note: >-
      *** THE R² THE PAPER MUST QUOTE — not R2_ens (see DO-NOT-MACRO block). ***
      R² of the conductance-form fit against the TRUE current, per seed, on the
      512-point trajectory. This is the positive half of the paper's headline:
      the closure recovers the FUNCTIONAL FORM s²(aV+b) at R² = 0.984 ± 0.014
      while its COEFFICIENTS (SymbolicAHat) do not identify. Form yes,
      coefficients no — state both in the same sentence or the result is
      misread. Note the domain: per-seed R² is on the trajectory; R2_ens is on
      the pooled hull grid. Not a like-for-like pair.

  - name: SymbolicRTwoSindyTrue
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_sindy_true
    round: 3
    # raw mean=0.955782 std=0.059157  -> 0.956 ± 0.059
    note: >-
      Unconstrained STLSQ/SINDy on the 6-term library {1, V, s, V·s, s², V·s²}
      vs the true current. The paper's cleanest "predictive accuracy ≠
      identifiability" illustration: R² = 0.956 while the fit NEVER SPARSIFIES
      (n_sindy_terms = 6/6 at every seed) and V·s² carries coefficient −1.469 at
      seed 1111 — THE WRONG SIGN against a true +2.0. High R², wrong physics.
      Contrast with SymbolicRTwoCondTrue, which is structure-informed (it
      hard-codes s² and the linear driving force) and so cannot fail structurally.

  # --- Negative control: gCa = 0.4. Single row (seed 1111), n=1, no std. -----

  - name: SymbolicAHatNegControl
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 0.4}
    emit: value
    column: a_hat
    round: 3
    # raw=-0.3719798574860592 (true a = gCa = 0.4)
    note: >-
      *** WRONG SIGN: −0.372 against a true +0.40. *** The negative control, and
      a far harder failure statement than its R² alone conveys — the recovered
      "conductance" is negative, i.e. the fit says calcium is an outward current.
      Companion: Erev = −239.87 mV against a true +120.0 (in the CSV's `Erev`
      column; add a macro if the paper quotes it). Single row, n=1, no error bar
      — never render this as ±anything. Pairs with GcaAblICaNormPointFour: at
      the physiological conductance both the closure and its distillation fail,
      and they fail consistently.

  - name: SymbolicRTwoCondTrueNegControl
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 0.4}
    emit: value
    column: r2_cond_true
    round: 3
    # raw=0.7806472493640154
    note: >-
      Negative control R² for the conductance form: 0.781 vs 0.984 at gCa=2.0
      (SymbolicRTwoCondTrue). Drives fig12's two-panel contrast. Caution: 0.781
      still sounds respectable — always quote it beside SymbolicAHatNegControl's
      sign error, which is what actually demonstrates the failure. n=1.

  - name: SymbolicRTwoSindyTrueNegControl
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 0.4}
    emit: value
    column: r2_sindy_true
    round: 3
    # raw=-0.35870485913710626
    note: >-
      *** NEGATIVE R²: −0.359 — the unconstrained SINDy fit is worse than
      predicting the mean. *** The unambiguous failure number at gCa=0.4, and
      the sharpest contrast in the paper (0.956 → −0.359 vs 0.984 → 0.781 for
      the structure-informed fit). It also shows what the conductance form's
      hard-coded s² is buying: structure props up a fit that carries no
      information. n=1.

  # ===========================================================================
  # BLOCK 6 — aggressive retrain (Adam 20000 / BFGS 1000 vs baseline 5000/300).
  # THE DECISIVE CONTROL: 4x the iterations, and every quantity got WORSE AND
  # NOISIER. Combined with bfgs_ok=true on all 5 seeds and a tight
  # RetrainFinalLoss, this proves the optimizer converged — to DIFFERENT closures
  # that fit the same training voltage equally well. Textbook non-identifiability.
  # Framing: more optimisation cannot recover information the single trajectory
  # does not contain. Never frame the coefficient gap as under-training; this
  # block is why.
  #
  # *** SCHEMA WARNING — this tree is bespoke. See the header. ***
  # symbolic/symbolic_recovery_metrics.csv here has the same 14 columns as
  # Block 5 (so those entries mirror cleanly), but metrics_retrain.csv is the
  # 7-column table with no `window` column and only 4 metrics. Before/after pairs
  # below were matched by SEMANTICS, not schema. Quantities the retrain tree
  # simply does not carry, and for which NO before/after comparison exists:
  # gate_rmse_mean, rollout_horizon_ms, ICa_rmse_norm, every common_eval_*,
  # every spike metric, and everything for voltage-only / NODE / other ablations
  # (only gCa=2.0 full-state was retrained).
  #
  # DO NOT add a retrain gCa=0.4 macro: that row is a BYTE-IDENTICAL COPY of the
  # baseline's (retrain_gca2_20k.jl:136-143 copies the probe in; the control was
  # never retrained). Presenting it as an independent "after" would be fabrication.
  # ===========================================================================

  - name: RetrainAHat
    source: retrain_gca2_20k/symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: a_hat
    round: 2
    # raw mean=1.494710 std=1.484287 (true 2.0). BEFORE: SymbolicAHat 1.60 ± 0.90.
    note: >-
      AFTER, vs SymbolicAHat BEFORE: the mean moved AWAY from the true 2.0
      (1.60 → 1.49) and the std INFLATED 64% (0.90 → 1.48). One seed (5555) went
      sign-negative (a_hat = −0.877). 4x the iterations bought a worse and
      noisier estimate. Quote the pair, always in that order, always with
      RetrainFinalLoss to preempt "you just under-trained it".

  - name: RetrainRTwoCondTrue
    source: retrain_gca2_20k/symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_cond_true
    round: 3
    # raw mean=0.845475 std=0.160284. BEFORE: SymbolicRTwoCondTrue 0.984 ± 0.014.
    note: >-
      AFTER, vs SymbolicRTwoCondTrue BEFORE: 0.984 ± 0.014 → 0.845 ± 0.160. The
      functional-form recovery — the paper's POSITIVE result — degrades under 4x
      optimisation, and its std grows 11x. This same before/after pair is the
      evidence that R2_ens is worthless (it moved 0.997333 → 0.997341 across
      this collapse); see the DO-NOT-MACRO block.

  - name: RetrainRmseNnTrue
    source: retrain_gca2_20k/symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: rmse_nn_true
    round: 3
    # raw mean=4.058757 std=1.476993. BEFORE: 1.270208 ± 0.246245 (same column, results/symbolic/).
    note: >-
      RMSE of the neural closure itself against the true current on the fit
      domain. AFTER 4.059 ± 1.477 vs BEFORE 1.270 ± 0.246 — a 3.2x degradation
      of the learned closure. NOTE the "before" twin is NOT currently a macro; if
      the paper quotes the pair, add a SymbolicRmseNnTrue entry against
      symbolic/symbolic_recovery_metrics.csv with filter {gCa: 2.0}, the same
      aggregate, and `column: rmse_nn_true` (singular — see the header).
      Do not hand-transcribe 1.270.

  - name: RetrainTrainVRmse
    source: retrain_gca2_20k/metrics_retrain.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: train_V_rmse
    round: 3
    # raw mean=0.243172 std=0.053636 n=5 -> 0.243 +/- 0.054
    # BEFORE (semantic twin): UdeTrainVRmse 0.148 +/- 0.045.
    note: >-
      *** THE OVERFITTING ROW. *** Train-window (t <= 30 ms, 154 points) V RMSE
      against the CLEAN trajectory - retrain_gca2_20k.jl:127,
      rmse_safe(data_clean[1, ti], pred_full[1, ti]) - which is the SAME object
      as UdeTrainVRmse, its legitimate BEFORE twin (same window, same n, also vs
      clean). AFTER 0.243 +/- 0.054 vs BEFORE 0.148 +/- 0.045: on the very
      samples the objective scores, the retrained model moved AWAY from the truth
      while the objective itself fell 35.71 -> 29.66. Quote this pair wherever
      TrainLossBefore/TrainLossAfter appear, or the 17% loss drop reads as a free
      lunch when it was bought by fitting one noise realisation. BESPOKE SCHEMA -
      no filter needed (all 5 rows are gCa=2.0 full-state, one per seed; the
      window lives in the column-name prefix).
      *** NOTE THE LIMIT. *** metrics_retrain.csv has NO V_rmse_vs_noisy column,
      so the retrain has no noise-floor twin of UdeTrainVRmseVsNoisy, and NO
      "below the noise floor" statement about the retrain is citable from any
      committed file. A loss evaluated at the true (gCa, ECa) is in no results
      CSV at all - do not quote one. Report the DIRECTION only: objective down,
      error against the truth up.


  - name: RetrainForecastVRmse
    source: retrain_gca2_20k/metrics_retrain.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: forecast_V_rmse
    round: 3
    # raw mean=0.755622 std=0.411361. BEFORE: UdeForecastVRmse 0.245 ± 0.028.
    note: >-
      BESPOKE SCHEMA — no filter needed (all 5 rows are gCa=2.0 full-state, one
      per seed) and no `window` column: the window lives in the column-name
      prefix. AFTER 0.756 ± 0.411 vs BEFORE UdeForecastVRmse 0.245 ± 0.028: even
      the trajectory forecast — the thing the loss actually optimises — got 3x
      worse and 15x noisier under 4x the iterations. This is the strongest
      single sentence against the under-training rebuttal.

  - name: RetrainForecastICaRmse
    source: retrain_gca2_20k/metrics_retrain.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: forecast_ICa_rmse
    round: 3
    # raw mean=3.846910 std=1.464938. BEFORE: UdeForecastICaRmse 1.189 ± 0.208.
    note: >-
      AFTER 3.847 ± 1.465 vs BEFORE UdeForecastICaRmse 1.189 ± 0.208 — the
      calcium closure got 3.2x worse. Bespoke schema; no ICa_rmse_norm twin
      exists in this table, so the normalized before/after comparison CANNOT be
      made. Do not construct one by dividing by a std taken from elsewhere.

  - name: RetrainFinalLoss
    source: retrain_gca2_20k/metrics_retrain.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: final_loss
    round: 2
    # raw mean=29.659901 std=2.663395 -> 29.66 ± 2.66. bfgs_ok=true on all 5 seeds.
    note: >-
      *** THE LOAD-BEARING NUMBER OF THE WHOLE ARGUMENT. *** A tight final loss
      (29.66 ± 2.66, 9% relative spread) plus bfgs_ok = true on all 5 seeds
      proves the optimiser CONVERGED. So the divergent coefficients
      (RetrainAHat: 1.49 ± 1.48) are not optimisation failure — five converged
      runs found five DIFFERENT closures that fit the same training voltage
      equally well. That is the definition of non-identifiability, and this
      macro is what turns "our numbers are noisy" into "the parameter is not
      determined by the data".
      Two caveats for the prose: (1) final_loss is SUM of squared errors on RAW
      coordinates, not a mean — do not compare it to any NODE loss (the NODE
      loss is on NORMALIZED coordinates; V contributes 10^4x less). (2) It is
      the last callback value over the concatenated Adam+BFGS history.
      bfgs_ok deserves its own value macro if the paper asserts the two-stage
      schedule ran — a failed BFGS polish degrades SILENTLY to the Adam result
      with only an @warn (train_two_stage, experiment.jl:96-125).

  # ===========================================================================
  # BLOCK 7 — setup constants and honesty counters.
  #
  # Only n_seeds is a legitimate extraction (it is a real column). Everything a
  # reader would call a "setup constant" — the model parameters, the iteration
  # budgets, the architecture, the ensemble fit — is NOT in any CSV. See the
  # NOT-EXTRACTABLE block below for how to handle each honestly.
  # ===========================================================================

  - name: UdeSeedCount
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: full, window: forecast, metric: V_rmse}
    emit: value
    column: n_seeds
    round: 0
    # raw=5
    note: >-
      n = 5 seeds, extracted rather than asserted, so that a dropped run cannot
      silently invalidate the paper's stated n. safe_run turns a failure into
      MISSING ROWS, not an error (experiments_runner.jl) — n_seeds is the only
      trace. Every "± std over N seeds" in the paper should read
      \valUdeSeedCount, never a literal 5. Reminder for the Methods text: a seed
      redraws the network init AND the OU noise realization jointly; the two
      variance sources are inseparable in these runs.

  - name: NodeSpikeDevSeedCount
    source: metrics_baseline_multiseed.csv
    filter: {model: NODE, observed: full, window: forecast, metric: spike_mean_abs_dev_ms}
    emit: value
    column: n_seeds
    round: 0
    # raw=2  <- every other NODE row in this file has n_seeds=5
    note: >-
      *** THE HONESTY COUNTER. n = 2, NOT 5. *** The NODE's spike accuracy
      (1.272 ± 0.415 ms) is averaged over only 2 of 5 seeds: the other 3 produced
      no spike matchable within the 2 ms tolerance, mean_abs_dev_ms came back
      NaN, and agg()'s filter(isfinite, ...) silently dropped them from both the
      mean AND the denominator. Quoting NODE 1.27 ms beside the UDE's 0.0 ± 0.0
      (n=5) without this counter would materially FLATTER a model that diverges
      within one sample of the forecast start. Either report n inline via this
      macro or drop the metric for NODE entirely; the second is cleaner. This
      macro exists so the choice is explicit rather than accidental.

  # ---------------------------------------------------------------------------
  # Macros the claim ledger cites. Added after reconciling claims.yaml against
  # this map: check_claims.py errors E-MACRO-MISSING on every one of these if it
  # is absent, because a claim whose number does not exist is unfalsifiable.
  # ---------------------------------------------------------------------------

  - name: UdeVoltageForecastGateRmse
    source: metrics_baseline_multiseed.csv
    filter: {model: UDE, observed: voltage, window: forecast, metric: gate_rmse_mean}
    emit: mean_std
    columns: {mean: mean, std: std, n: n_seeds}
    round: 5
    # raw mean=0.0010597619993722 std=0.0004335527474268 n_seeds=5
    note: >-
      The gate error of the VOLTAGE-ONLY runs — the subject of
      physics-prior-reconstructs-unobserved-gates. *** DO NOT substitute
      UdeForecastGateRmse: that macro filters observed=full, and the claim is
      about the runs where the gates never entered the loss. Swapping them makes
      the claim's own subject wrong. *** The gates are hidden from the
      OBJECTIVE, not from the solver (u0 is the full true 6-state IC), so say
      "never scored during training", never "never known".

  - name: RetrainBfgsOk
    source: retrain_gca2_20k/metrics_retrain.csv
    emit: list
    column: bfgs_ok
    # raw=[true, true, true, true, true] — one row per seed, all 5 converged
    note: >-
      THE CONVERGENCE CONTROL. All 5 seeds report bfgs_ok=true, which is what
      turns the aggressive retrain from "we under-trained" into
      non-identifiability: the optimizer converged, and it converged to
      DIFFERENT closures that fit the same voltage equally well. Pair with
      RetrainFinalLoss. A boolean column: emit list renders it "true, true, ..."
      verbatim — it is a flag, not a quantity, so never average it.

  - name: SindyNTermsRetained
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0}
    emit: list
    column: n_sindy_terms
    round: 0
    # raw=[6, 6, 6, 6, 6] — the gCa=0.4 negative-control row is also 6
    note: >-
      Sparse regression that never sparsifies: all 6 library terms retained at
      every one of the 5 seeds. This is the point of sindy-does-not-sparsify —
      emit list, not mean_std, because "6.0 ± 0.0" would present a constant as a
      distribution and invite the reader to wonder about the spread. There is no
      spread. The 6-term library (EXPONENTS) is objective3_symbolic.jl:56 and
      TAU=0.05 is objective3_symbolic.jl:49 -- NOT src/metrics.jl, which contains
      neither. CAVEAT ON THE COUNT: sindy_recover (objective3_symbolic.jl:107-112)
      thresholds only the five NON-constant columns and forces the intercept into
      the active set unconditionally, so 5 of 6 is the sparsest model this
      estimator can return and "6" means "all five thresholded terms retained",
      not "nothing could be dropped".

  - name: BaselineRepSeedForecastVRmse
    source: metrics_all.csv
    filter: {model: UDE, observed: full, window: forecast, metric: V_rmse, seed: 1111,
             gCa: 2.0, noise_level: 0.02, t_train_end: 30.0}
    emit: value
    column: value
    round: 3
    # raw=0.2191970340109573
    note: >-
      The BEFORE half of retrain-seed-decoupling, at the representative seed
      1111 (REP_SEED, experiments_runner.jl:58). The full baseline condition
      must be pinned — gCa/noise_level/t_train_end all vary in metrics_all.csv,
      and without them this filter matches 12 rows. Compare only against
      RetrainRepSeedForecastVRmse, which is the same seed.

  - name: RetrainRepSeedForecastVRmse
    source: retrain_gca2_20k/metrics_retrain.csv
    filter: {seed: 1111}
    emit: value
    column: forecast_V_rmse
    round: 3
    # raw=0.2509357938396778. BEFORE (same seed): 0.219197
    note: >-
      The AFTER half of retrain-seed-decoupling at seed 1111. BESPOKE SCHEMA —
      no gCa/window columns exist here (all 5 rows are gCa=2.0 full-state, one
      per seed; the window lives in the column-name prefix). Paired same-seed
      with BaselineRepSeedForecastVRmse so the comparison is not confounded by
      seed. NOTE the direction: 0.219 -> 0.251 under 4x the iterations. Worse.

  - name: BaselineRepSeedRTwoCondTrue
    source: symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0, seed: 1111}
    emit: value
    column: r2_cond_true
    round: 3
    # raw=0.9881456983773574
    note: >-
      BEFORE, seed 1111. Quote r2_cond_true, never the ensemble R^2=0.997, which
      is uninformative (it moved 0.997333 -> 0.997341 while per-seed R^2
      collapsed 0.984 -> 0.845). See claim-guards.md.

  - name: RetrainRepSeedRTwoCondTrue
    source: retrain_gca2_20k/symbolic/symbolic_recovery_metrics.csv
    filter: {gCa: 2.0, seed: 1111}
    emit: value
    column: r2_cond_true
    round: 3
    # raw=0.579578157193855. BEFORE (same seed): 0.988146
    note: >-
      AFTER, seed 1111: 0.988 -> 0.580. The single most legible number in the
      retrain: quadrupling the budget did not refine the closure, it moved to a
      different one. Same-seed pairing with BaselineRepSeedRTwoCondTrue is what
      makes this a decoupling result rather than a seed-noise result.


# ===========================================================================
# BLOCK 8 - PARAMETRIC IDENTIFIABILITY (added 2026-08 for review point 1).
# Source: identifiability/parametric_fit.csv, written by
# identifiability_parametric.jl. WIDE per-config schema, one row per
# (gCa_true, seed): the DIRECT two-parameter fit of (gCa, ECa) to the same
# single noisy trajectory, with the true structure known and NO network.
#
# *** THIS BLOCK CARRIES THE PAPER'S CENTRAL COMPARISON. ***
# ParamFitGcaHatTwo (2.09 +/- 0.13) against SymbolicAHat (1.60 +/- 0.90) is
# the whole result: the data determine the conductance to about +/-6%, and the
# neural closure loses that by roughly 9x. Never quote one without the other -
# alone, each is merely a number; together they locate the failure in the
# REPRESENTATION rather than in the data.
#
# Fair-comparison caveat that must travel with these macros: a 2-parameter
# model with the true functional form is EXPECTED to beat a 337-parameter
# closure that is given no form at all. The claim is therefore "the data
# support the parameter, so the UDE's spread is a cost of the closure" - NOT
# "two equally good fits disagree". The parametric fit also forecasts better
# (ParamFitForecastVRmseTwo vs UdeForecastVRmse), so they are not equally good.
# ===========================================================================

  - name: ParamFitGcaHatTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: gCa_hat
    round: 3
    # raw mean=2.092366 std=0.130497 n=5 (true 2.0); per-seed 1.877..2.211
    note: >-
      The headline positive control. 2.09 +/- 0.13 against a true 2.0, a 6.2%
      relative spread that brackets the truth. Cross-validated three ways: the
      profile-likelihood 95% CI and the Gauss-Newton relative standard error
      (CondRelSeGcaTwo, 6.7%) both agree with this observed seed spread. Quote
      WITH SymbolicAHat, always.

  - name: ParamFitGcaHatRangeTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    emit: range
    column: gCa_hat
    round: 3
    # raw min=1.877017 max=2.211192 n=5
    note: >-
      The span, for direct comparison with SymbolicAHatRange (0.673--3.095).
      A factor of 1.18 against the closure's 4.6.

  - name: ParamFitEcaHatTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: ECa_hat
    round: 1
    # raw mean=111.911 std=11.976 n=5 (true 120.0)
    note: >-
      The reversal potential is the WEAKER of the two parameters (10.7% spread
      vs 6.2%), consistent with the FIM relative standard errors and with the
      near -1 correlation between log gCa and log ECa. Do not present ECa as
      recovered as cleanly as gCa.

  - name: ParamFitGcaHatPointFour
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 0.4}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: gCa_hat
    round: 3
    # raw mean=0.437750 std=0.065327 n=5 (true 0.4)
    note: >-
      Even at the PHYSIOLOGICAL conductance the parametric fit recovers gCa
      (0.44 +/- 0.07), where the UDE plus symbolic route returns the WRONG SIGN
      (SymbolicAHatNegControl = -0.37). The contrast at gCa=0.4 is starker than
      at 2.0 and is the sharpest single statement of the paper's thesis.

  - name: ParamFitGcaHatOne
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 1.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: gCa_hat
    round: 3
    # raw mean=1.043098 std=0.084459 n=5 (true 1.0)

  - name: ParamFitGcaHatFour
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 4.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: gCa_hat
    round: 3
    # raw mean=4.105297 std=0.119830 n=5 (true 4.0)
    note: >-
      Completes the monotone tightening across the sweep: relative spread runs
      14.9% then 8.1% then 6.2% then 2.9% as the calcium signal grows. The
      parametric fit degrades gracefully where the closure degrades
      catastrophically.

  - name: ParamFitChiSqPerPointTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean], ddof: 1, dropna: true}
    emit: value
    column: chi2_per_point
    round: 3
    # raw mean=0.994436 n=5
    note: >-
      chi-square per data point at the optimum, with sigma_i the KNOWN
      per-channel noise SD. A value of 1.0 means the fit sits exactly at the
      noise floor: the model is correct and the weighting is right. This is what
      licenses the chi-square threshold used for the profile-likelihood CI.
      Report it as a goodness-of-fit sanity check, not as a result in itself.

  - name: ParamFitGcaHatTwoSseFull
    source: identifiability/parametric_matched_objective.csv
    filter: {gCa_true: 2.0, objective: sse_full}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: gCa_hat
    round: 2
    # raw mean=2.4780 std=0.4893 n=5 -> 2.48 +/- 0.49 (rel SD 19.7%)
    # SAME setting under the weighted chi-square: ParamFitGcaHatTwo 2.09 +/- 0.13 (6.2%).
    note: >-
      *** THE MATCHED-OBJECTIVE CONTROL. *** The same two-parameter fit as
      ParamFitGcaHatTwo -- same data, same true functional form, same three
      Nelder-Mead starts, same solver and tolerances -- minimising the FULL-STATE
      UDE's own unweighted SSE instead of the weighted chi-square. Produced by
      parametric_matched_objective.jl, whose self-test re-fits the chi-square row
      through the identical code path and reproduces parametric_fit.csv with a
      worst relative disagreement of exactly 0, so the ONLY variable between the
      two numbers is the objective. Use it to say what the paper could previously
      only disclose: of the 6%-to-41% gap between the parametric fit and the
      closure, the objective accounts for about 3.2x (6.2 -> 19.7%) and the
      representation for about 2.1x (19.7 -> 40.9%). Quote it wherever the
      parametric-vs-closure ratio is stated, or the ratio reads as pure
      representation. The voltage-only objective gives 2.479 +/- 0.489, i.e. the
      same to three decimals -- an independent confirmation of LossShareV.

  - name: ParamFitSseFullTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: sse_full
    round: 2
    # raw mean=39.3296 std=1.2585 n=5 -> 39.33 +/- 1.26
    note: >-
      *** THE NOISE-FLOOR REFERENCE FOR THE UDE'S OWN OBJECTIVE. *** This is
      sse_full evaluated at the maximum-likelihood (gCa, ECa) of the TRUE model
      structure - identifiability_parametric.jl:115 computes it as
      sum(abs2, data_noisy[:, train_idx] .- pred), which is BYTE-FOR-BYTE the
      full-state UDE objective of make_ude_loss (src/experiment.jl:185): same six
      channels, same 154 training samples, unweighted, native units, no
      normalisation. So it is directly comparable to TrainLossBefore /
      TrainLossAfter and to nothing else. It says what score the correct physics
      can achieve on this noisy data. The UDE beats it (35.71 before, 29.66
      after, against 39.33): a model that scores BELOW what the true structure
      can score is fitting the noise realisation, which is the whole point of the
      retrain control. CAVEAT to keep with it: this is the SSE at the chi-square
      optimum, not the argmin of SSE, so it is a slight OVER-estimate of the true
      floor - on seed 1111, where loss_surface_gca2.0.csv gives the full grid, the
      SSE-optimal point scores 39.57 against 39.74 here, i.e. under half a per
      cent lower. The margin to 35.71 is twenty times that, so the conclusion is
      not sensitive to it. Never describe this as "the objective at the true
      parameters" - that quantity is in no committed CSV.

  - name: ParamFitForecastVRmseTwo
    source: identifiability/parametric_fit.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: forecast_V_rmse
    round: 3
    # raw mean=0.123 std=0.032 n=5; UDE full-state is 0.245 +/- 0.028
    note: >-
      The parametric fit ALSO forecasts about twice as well as the UDE. Quote
      this whenever the comparison is made: it is the reason the honest claim is
      "the data determine the parameter" and NOT "two equally good fits
      disagree". Omitting it would overstate the result.

# ===========================================================================
# BLOCK 9 - CONDITIONING / FISHER INFORMATION.
# Source: identifiability/conditioning.csv (identifiability_parametric.jl
# Part 4). Gauss-Newton FIM from FIRST-order sensitivities, expressed in LOG
# parameters so the eigen-directions are scale-free.
#
# Two methodological choices are load-bearing and must be stated wherever these
# macros appear:
#   (1) first-order sensitivities, NOT a finite-difference Hessian of the
#       chi-square. This is a spiking model; phase shifts make the chi-square
#       rise by ~1e6 within a fraction of a percent of the optimum, and second
#       differences return two near-equal ~1e9 eigenvalues and an implied
#       relative SE of 3e-5, contradicted by both the profile and the seed
#       spread.
#   (2) log parameters. In raw units gCa ~ 2 and ECa ~ 120, so the "sloppy"
#       eigenvector falls on a coordinate axis as a pure units artifact.
# ===========================================================================

  - name: CondRelSeGcaTwo
    source: identifiability/conditioning.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: rel_se_gCa
    round: 3
    # raw mean=0.066675 std=0.003949 n=5
    note: >-
      Asymptotic RELATIVE standard error of gCa, 6.7%. Matches the observed seed
      spread (6.2%, ParamFitGcaHatTwo) almost exactly, an independent
      confirmation that the seed-to-seed scatter of the parametric fit is
      ordinary estimation noise and nothing more.

  - name: CondRelSeEcaTwo
    source: identifiability/conditioning.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: rel_se_ECa
    round: 3
    # raw mean=0.111041 std=0.002540 n=5

  - name: CondRelSeGcaPointFour
    source: identifiability/conditioning.csv
    filter: {gCa_true: 0.4}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: rel_se_gCa
    round: 3
    # raw mean=0.269350 std=0.043544 n=5
    note: >-
      At the physiological conductance the parametric fit is four times less
      precise (26.9% vs 6.7%) but still finite and still correctly signed. The
      information degrades smoothly with signal amplitude; it does not vanish.

  - name: CondNumberTwo
    source: identifiability/conditioning.csv
    filter: {gCa_true: 2.0}
    aggregate: {over: seed, stats: [mean], ddof: 1, dropna: true}
    emit: value
    column: cond_number
    round: 0
    # raw mean=7088.4 n=5 (log-parameter FIM)
    note: >-
      Condition number of the log-parameter Fisher information. Large, so there
      IS a sloppy direction: gCa and ECa trade off along an identifiable
      combination (their log-correlation is about -1.00). But sloppy is not the
      same as non-identifiable, since both parameters still have finite, small
      relative standard errors. That distinction is the point.

# ===========================================================================
# BLOCK 10 - TRAINING LOSS, BEFORE vs AFTER THE AGGRESSIVE RETRAIN.
# Source: identifiability/training_losses_before_after.csv
# (recover_training_losses.jl). Answers review point 1 final sentence.
#
# The BEFORE loss was never recorded at training time; it is recovered by
# rebuilding the exact objective and evaluating it at the SAVED parameters. The
# script validates the method by recomputing the AFTER loss and matching the
# recorded value to a relative difference of 0.
# ===========================================================================

  - name: TrainLossBefore
    source: identifiability/training_losses_before_after.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: final_loss_before
    round: 2
    # raw mean=35.714740 std=1.813485 n=5
    note: >-
      Fills the "not recorded" cell in the retrain table. Directly comparable to
      TrainLossAfter: identical objective, data, seeds, solver and tolerances,
      with only the iteration budget differing.

  - name: TrainLossAfter
    source: identifiability/training_losses_before_after.csv
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: final_loss_after_recomputed
    round: 2
    # raw mean=29.659851 std=2.663400 n=5; a 17.0% reduction on the before mean
    note: >-
      *** THE RETRAIN GENUINELY OPTIMISED BETTER: 35.71 to 29.66, a 17%
      reduction. *** This STRENGTHENS the control rather than weakening it. The
      earlier framing ("the final losses are tight, so the optimiser converged")
      understated the result: the aggressive run demonstrably fit the training
      data better while the conductance estimate, the R-squared and the forecast
      all got worse. That is optimisation along a flat direction, seen directly.

# ===========================================================================
# BLOCK 11 - SYMBOLIC FIT DOMAIN ROBUSTNESS (review point 3).
# Source: identifiability/symbolic_domain_comparison.csv
# (scripts/symbolic_domain_comparison.py). Refits the SAME conductance form on
# nested domains: the published convex hull, epsilon-tubes around the
# trajectory, the full trajectory, and the strictly SUPERVISED trajectory.
#
# The reviewer objection was that a limit cycle's convex-hull INTERIOR was never
# visited, so hull values are extrapolation dressed as interpolation. Conceded,
# and the conclusion is unchanged on every domain, which is the point of the
# block. The script reproduces the published hull fit to 1e-15.
# ===========================================================================

  - name: SymbolicAHatTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: a_hat
    round: 3
    # raw mean=1.645 std=0.672 n=5 (true 2.0)
    note: >-
      *** PREFER THIS OVER SymbolicAHat AS THE HEADLINE. *** Same estimator, but
      fitted only on points the model was actually supervised on (t <= 30 ms,
      n=154). It concedes the hull objection completely and costs nothing: the
      estimate is if anything slightly closer to the truth than the hull fit, and
      the spread is comparable. Keep the hull only for the SINDy comparison,
      where its conditioning rationale genuinely applies.

  - name: SymbolicAHatRangeTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    emit: range
    column: a_hat
    round: 3
    # raw min=1.241 max=2.816 n=5

  - name: SymbolicRTwoTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_vs_true_on_domain
    round: 3
    # raw mean=0.991 std about 0.006 n=5
    note: >-
      The fitted CURVE matches the true current well on the supervised
      trajectory (R-squared 0.99) while the COEFFICIENT that curve implies is off
      by 18% with a 41% spread. Curve-fit quality and coefficient
      identifiability are different properties; this pair of macros is the
      cleanest place in the paper to say so.
      *** THIS IS AGREEMENT WITH THE TRUE CURRENT, NOT WITH THE CLOSURE. *** It
      does NOT support the sentence "the learned closure is well approximated by
      the expected conductance form" - that one needs SymbolicRTwoNnTrajTrain
      below, which scores the same fit against the NETWORK's output.

  - name: SymbolicRTwoNnTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_vs_nn_on_domain
    round: 3
    # raw mean=0.984670 std=0.009246 n=5
    note: >-
      *** THE CLOSURE-AGREEMENT NUMBER. NOT interchangeable with
      SymbolicRTwoTrajTrain. *** Same rows, same domain, different column:
      r2_vs_nn_on_domain scores the two-term fit against the NETWORK's own
      output (symbolic_domain_comparison.py:152), r2_vs_true_on_domain scores it
      against the analytic current (line 151). Only this one licenses "the
      learned closure is well approximated by the expected conductance form"
      (claim symbolic-form-recovered). On the supervised trajectory the two
      happen to be close (0.985 against 0.991); on the hull they are not
      (0.936 against 0.973), so the substitution is not harmless.

  - name: SymbolicRTwoNnRangeTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    emit: range
    column: r2_vs_nn_on_domain
    round: 3
    # raw min=0.974644 max=0.996549 n=5

  - name: SymbolicRTwoNnHull
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: hull}
    aggregate: {over: seed, stats: [mean, std], ddof: 1, dropna: true}
    emit: mean_std
    column: r2_vs_nn_on_domain
    round: 3
    # raw mean=0.936042 std=0.074783 n=5
    note: >-
      The same closure-agreement score on the CONVEX HULL, i.e. off the points
      the network was supervised on. Lower and far more seed-dependent than the
      supervised-trajectory value (0.936 +/- 0.075 against 0.985 +/- 0.009;
      worst seed 0.816 against 0.975). This is the domain the two symbolic
      figure panels are fitted on, so it is the number that governs how much
      those panels may be read as "the form describes the closure". DOMAIN RULE:
      any sentence or caption quoting this macro must contain the word "hull".

  - name: SymbolicRTwoNnRangeHull
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: hull}
    emit: range
    column: r2_vs_nn_on_domain
    round: 3
    # raw min=0.816229 max=0.990936 n=5

  - name: SymbolicCondTrajTrain
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: traj-train}
    aggregate: {over: seed, stats: [mean], ddof: 1, dropna: true}
    emit: value
    column: cond
    round: 1
    # raw mean=102.4 n=5 (2-column design matrix)
    note: >-
      Corrects a mis-stated justification in the earlier draft. For the TWO-term
      conductance form the trajectory is perfectly well conditioned (about 102,
      against 70 on the hull), so the near-collinearity argument does NOT apply
      here. Whether it applies to the SIX-term SINDy library is UNMEASURED:
      nothing in this repo computes a six-column condition number
      (scripts/symbolic_domain_comparison.py:107-119 forms only the 2x2 Gram of
      [V s^2, s^2], and no results file carries a library-conditioning column).
      The "about 25k on the trajectory, 14k on the hull" figures that stood here
      until 2026-08-20 had no source and were deleted. Do not restore them
      without a committed computation; this note is copied verbatim into
      generated/metrics.tex, whose header promises mechanical extraction.

  - name: SymbolicCondHull
    source: identifiability/symbolic_domain_comparison.csv
    filter: {domain: hull}
    aggregate: {over: seed, stats: [mean], ddof: 1, dropna: true}
    emit: value
    column: cond
    round: 1
    # raw mean=69.9 n=5

# ===========================================================================
