# =============================================================================
#  consistency.yaml -- the repeated-claim ledger
# =============================================================================
#  WHY THIS FILE EXISTS
#
#  Five audit rounds found 154 defects. By rounds 4 and 5 almost none of them
#  were errors of fact any more; they were CONSISTENCY DEBT. The paper asserts
#  the same dozen things in three to six places each. A correction lands in one
#  or two of them, the other sites keep the old wording, and the next audit finds
#  the survivors. Each fix seeds the next round's findings, which is why the
#  defect rate flattened at ~1.6 per audit area instead of falling to zero.
#
#  The round-5 BLOCKER is the archetype. Round 4 established that the
#  matched-objective control never isolates the optimiser, so the residual
#  twofold BOUNDS the representation rather than measuring it, and wrote the rule
#  into claims.yaml: "Say 'at most', never 'is'." That fix was then applied to
#  Limitations and nowhere else. The abstract -- the most-read sentence in the
#  paper -- still said the representation's own contribution "is" a factor of
#  about two. One site fixed out of five.
#
#  No existing checker can see this. check_numbers verifies traceability,
#  check_claims verifies the ledger is anchored, and neither compares two
#  sentences to each other. This file does.
#
#  HOW IT WORKS
#  Each group is a claim the paper makes in more than one place.
#    probe    finds the sites (case-insensitive regex over non-comment text)
#    require  every probed site must ALSO match this, or it is flagged
#    forbid   no site anywhere in the file may match this, ever
#    min_sites  guards against a probe that has silently stopped matching
#  Run:  python scripts/check_consistency.py
#
#  WHEN YOU CHANGE A CLAIM: add or update its group here FIRST, then let the
#  checker tell you every site you still have to touch. That is the whole point.
# =============================================================================

groups:

  - id: representation-share-is-an-upper-bound
    why: >-
      The matched-objective control swaps the objective but keeps multi-start
      Nelder-Mead, so it never isolates the optimiser. The residual ~2.1x is
      representation AND optimiser together. Every site that quotes the
      representation's share must mark it as a bound, never as a measured value.
      Round 5 blocker: the abstract said "is" while Limitations said "at most".
    files: [paper/main.tex, paper/sim2science/main.tex, README.md]
    probe: '(twofold|factor of about two|two-fifths)[^.]{0,200}?representation|representation[^.]{0,200}?(twofold|factor of about two|two-fifths)'
    require: '(at most|bounds|bounding|upper bound|no more than|remainder bounds)'
    forbid: >-
      (representation's own contribution is a factor|
       objective and the representation each account for roughly half|
       representation owns a factor of about two)
    min_sites: 4

  - id: retired-data-side-thesis
    why: >-
      The paper's thesis was reversed in Aug 2026. The retired claim -- that the
      conductance is not identifiable from a single trajectory, or that the data
      are at fault -- must never reappear. It came back twice: once at
      main.tex:623 in the gCa=0.4 justification, once in the Introduction.
    files: [paper/main.tex, paper/sim2science/main.tex, README.md, paper/claims.yaml]
    probe: null
    forbid: >-
      (not identifiable from a single trajectory|
       single trajectory cannot determine|
       too small a contribution to the voltage to be recoverable at all|
       the data cannot determine)

  - id: optimiser-is-full-bfgs
    why: >-
      src/experiment.jl calls OptimizationOptimJL.BFGS. There is no LBFGS
      anywhere in the codebase. "L-BFGS" appeared ten times in the prose and
      twice inside figure supertitles, where it survived a round of prose fixes.
    files: [paper/main.tex, paper/sim2science/main.tex, README.md, paper/claims.yaml, figure_coeff_recovery_panels.jl]
    probe: null
    forbid: 'L-BFGS'

  - id: five-gates-not-six
    why: >-
      There are five gates (m, h, n, p, s) and six STATE ODEs, the sixth being
      the voltage equation. "six gate ODEs" appeared in Figure 1 and its caption.
      "six states" is correct and must not be caught by this rule.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: null
    forbid: 'six gate'

  - id: profile-interval-is-interpolated
    why: >-
      The 95% profile interval is the interpolated Delta-chi2 crossing
      [1.6065, 2.1477], not the raw 0.0625-grid bracket [1.63, 2.13]. The old
      bracket pushed seed 3333 outside the band and licensed "every one of the
      five falls outside", which is a statement about scan resolution.
    files: [paper/main.tex, paper/sim2science/main.tex, paper/claims.yaml, figure_identifiability.jl]
    probe: null
    forbid: >-
      (1\.63,\s*2\.13|
       \[1\.625,\s*2\.125\]|
       [Ee]very one of the five (closure )?(conductances|estimates)|
       all five (closure )?estimates fall outside)

  - id: closure-count-outside-interval
    why: >-
      Four of the five traj-train closure estimates fall outside the interpolated
      interval; seed 3333 at 1.6069 is inside by 0.0004. Any site restating the
      count must say four, not five.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: '(conductances|closure estimates)[^.]{0,200}?(outside|inside)[^.]{0,80}?(that )?interval'
    require: '([Ff]our|4 of 5|lower edge)'
    min_sites: 1

  - id: conductance-numbers-name-their-domain
    why: >-
      THE DOMAIN RULE. Hull and supervised-trajectory conductance estimates
      differ by ~6x at gCa=0.4. Four separate defects came from quoting one
      without saying which. Any line carrying a hull-only macro must say "hull"
      on that line or within its caption.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: 'valSymbolicAHatNegControl|valSymbolicAHatMeanStd|valSymbolicAHatRange[^T]|valGcaFourRetrainAHat'
    require: '(hull|convex)'
    window: 70   # a table row can sit far below its caption
    min_sites: 3

  - id: no-equally-good-fits
    why: >-
      The licensed inference is one-directional: because the data pin the
      conductance, the closure's failure is not the data's fault. A 2-parameter
      model given the true form is EXPECTED to beat a 337-parameter closure, so
      the paper must never present the two as equally good fits that disagree.
    files: [paper/main.tex, paper/sim2science/main.tex, README.md]
    probe: null
    forbid: '(two equally good fits|equally good fits disagree|both fit equally well)'
    # The paper legitimately DENIES this phrasing; only an affirmative use is a defect.
    forbid_unless: '(not that|never|must not|do not|rather than) '

  - id: rollout-horizon-is-censored
    why: >-
      The rollout horizon is right-censored at min(cap, available). Guard G1
      forbids quoting a mean +/- SD for it, and forbids presenting the cap as a
      measurement. The common-eval window is ~49.9 ms, so a 70 ms cap there is
      unreachable.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: 'valUdeForecastRollout|valUdeVoltageForecastRollout'

    require: '(censor|cap|saturat|>=|\\ge|never (leaves|breach))'
    window: 60
    min_sites: 2

  - id: symbolic-form-is-supplied
    why: >-
      Mentor review point 2. The conductance form s^2(aV+b) is SUPPLIED to the
      estimator, not discovered by it. Any sentence claiming functional-form
      recovery must carry that qualification.
      The forbid half of this rule cannot see the opposite failure: the paper
      losing its affirmative statement of the qualification. The probe covers
      that. Every site reporting what the distilled CLOSURE achieves must name
      the constraint that made the distillation possible, because the result is
      conditional on it.
      Scope, deliberately narrow: "the distilled closure", not "distilled"
      generally. The mentor's ask was about overclaiming DISCOVERY, so the rule
      fires on sites asserting agreement and not on back-references ("the
      distilled form becomes a worse predictor", main.tex:1697) or on reports of
      the supplied form FAILING, which cannot be misread as discovery. Widen this
      probe only with a site in hand that the narrow one misses.
    files: [paper/main.tex, paper/sim2science/main.tex, README.md]
    probe: 'the distilled\s+closure\b'
    require: '(given the conductance form|constrained to|supplied|imposed|structure-informed|assumed form)'
    window: 12
    min_sites: 2
    forbid: >-
      (discovers the functional form|
       recovers the functional form|
       functional-form recovery)

  - id: loss-share-names-its-conditions
    why: >-
      The 99.97 % voltage share is a property of the UNWEIGHTED, native-units
      objective evaluated AT THE NOISE FLOOR, and the paper states it in seven
      places. Drop "unweighted" and the number is simply false: eq:chisq divides
      every channel by its own noise scale and weighs the six comparably. Drop
      "at the noise floor" and it becomes an unconditional claim about the
      objective that was never computed -- the share is derived from each
      channel's noise magnitude, not from the loss at an arbitrary point in
      training. Seven sites for one number is exactly the fan-out that produced
      the round-5 blocker.
    files: [paper/main.tex, paper/sim2science/main.tex, paper/claims.yaml]
    probe: '\\LossShareV\\,\\%|99\.97\s*%'
    require: '(unweighted|noise floor|native units|no channel weights|no normalisation)'
    window: 20
    min_sites: 7

  - id: rollout-cap-is-not-a-window-length
    why: >-
      \Rcap is the METRIC's ceiling (cap_ms = 70.0, src/metrics.jl:93), not the
      length of the forecast window. The two coincide only at t_train_end = 30.
      The window ablation at 40 ms leaves a 60 ms remainder and the corrected
      metric returns 59.883, so a sentence using \Rcap to mean "the remainder"
      prints a window length from a macro that does not track it. Guard G1
      separately forbids presenting the cap as a measured duration: a horizon
      equal to the bound means "never breached" and is reported with >=. So
      every site that prints \Rcap must be talking about the cap, and must carry
      censoring language. Note the require cannot be satisfied by the macro name
      itself -- \bcap\b does not match inside \Rcap.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: '\\Rcap\\,ms'
    require: '(censor|saturat|\bcap\b|never (leaves|breaches|breach|left)|unreachable|never reach|\\ge|>=)'
    window: 8
    min_sites: 6

  - id: node-failure-attributed-to-architecture
    why: >-
      The neural ODE's blow-up is architectural, not a budget shortfall, and that
      attribution is licensed only because the budget control was RUN: matching
      the UDE's Adam/BFGS iterations changes nothing, while removing the raw time
      input at that same budget improves the horizon by more than an order of
      magnitude. A site that asserts the architectural attribution without naming
      the budget control is an unsupported assertion, and round 2 already found
      one clause attributing the failure to a mechanism the recorded training
      errors contradict. Asserted in the contributions bullet, the Results
      paragraph and the Table 2 caption.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: '(failure is architectural|attributes the failure|artifact of an architecture|failure of the original baseline)'
    require: '(budget|iterations|\\AdamUde|\\AdamNode)'
    window: 12
    min_sites: 3

  - id: seed-count-is-five-everywhere
    why: >-
      n = 5 reaches print two ways: \valUdeForecastVRmseN, which is traced to the
      CSVs, and the word "five", which is not -- check_numbers is line-based and
      digit-based, so a spelled-out count is invisible to it. If the seed set ever
      changed, every macro site would update and every prose site would silently
      go on saying five. This group pins the count by refusing any other number of
      seeds anywhere in the manuscript. "Four of the five seeds" is not caught:
      the words are not adjacent.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: null
    forbid: '\b(one|two|three|four|six|seven|eight|nine|ten|[0-9]+) seeds\b'

  - id: ablations-declare-single-seed
    why: >-
      Guard G13. Every ablation point except the conductance sweep is one run at
      seed 1111 with no error bar. Any ablation sentence must say so.
    files: [paper/main.tex, paper/sim2science/main.tex]
    probe: '(window|noise)[- ]ablation'
    only_if: 'val[A-Z]'
    require: '(single seed|one run|single-seed|no error bars|n\s*=\s*1)'
    window: 10
    min_sites: 1

  - id: functional-identifiability-names-its-scope
    why: >-
      Added 2026-08-26 after the mentor asked for precision rather than breadth:
      "we can make exact claim if some of the identification is not working."
      Two distillations WERE run on the learned closure -- the constrained
      two-term fit on the supplied form s^2(aV+b), and the unconstrained six-term
      sparse regression -- and both fail, differently (scattered conductance; and
      no sparsification with the physical Vs^2 term wrong-signed at the
      representative seed). Two is not all. Nothing in these runs tests a
      symbolic method with a different inductive bias, a different basis, or a
      constraint on E_Ca that the closure does not supply, and nothing varies the
      closure's architecture. So the evidence licenses "functional identifiability
      fails FOR THIS CLOSURE UNDER THESE DISTILLATIONS", not a property of
      closures in general.
      The Loman/Browning/Baker vocabulary stays -- it is the correct frame and the
      mentor asked for it. What must travel with it is the binding scope. The
      thesis is stated in the abstract, the contributions, the Discussion, the
      README and the claims ledger, which is exactly the five-site fan-out that
      produced the round-5 blocker.
    files: [paper/main.tex, paper/sim2science/main.tex, README.md, paper/claims.yaml]
    probe: 'functional(ly)?[- ]identifiab\w*'
    require: >-
      (this\s+closure|these\s+closures|this\s+distillation|these\s+distillations|
       distilled\s+this\s+way|one\s+closure|as\s+distilled\s+here|
       this\s+representation|the\s+closure\s+studied\s+here)
    window: 6
    # \s+ and not a literal space, deliberately: the checker joins the context
    # with ' '.join(), so a qualifier that straddles a line break inside an
    # \item block arrives as "for this   closure" -- three spaces -- and a
    # single-space literal silently never matches. Found the hard way, 2026-08-26.
    min_sites: 4
    forbid: >-
      (functional identifiability fails in general|
       no closure can recover|
       closures cannot recover|
       flexible closures do not identify)
