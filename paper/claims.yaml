# claims.yaml — the claim ledger for the Hodgkin–Huxley SciML paper
# ============================================================================
#
# WHAT THIS FILE IS
#   The complete list of every falsifiable statement the paper makes. Written in
#   the Claims phase, BEFORE any prose exists. Schema: CONTRACT §6.
#
# HOW IT IS USED
#   1. Draft phase: every paragraph that asserts something is anchored in the .tex
#      with `% claim: <id>`. If you cannot name the claim, you are not making one —
#      you are padding. Delete the paragraph.
#   2. scripts/check_claims.py cross-checks ledger ↔ paper and exits 1 if:
#        - a claim's referenced macro is missing from the GENERATED macro file
#          (`paper/generated/metrics.tex`, via --metrics-tex; or --metrics-json).
#          NOTE: the checker does NOT read metrics_map.yaml — it resolves macros against the
#          artifact extract_metrics.py *builds* from that map. A macro can be spec'd in the map
#          and still fail here if extraction never ran. [verified: check_claims.py --help]
#        - a claim with `status: supported` is never anchored in the .tex
#          (`unsupported`/`retired`/`overreaching` are exempt from the anchoring requirement)
#        - a .tex anchor references an unknown claim id
#        - ANY claim carries `status: overreaching` — anchored or not
#   3. Rebuttal: reviewer objections are answered by pointing at a claim's `scope`,
#      not by arguing. If the objection lands outside `scope`, the paper never
#      claimed it. If it lands inside, the claim was wrong and gets downgraded.
#
# IDS ARE PERMANENT HANDLES
#   An `id` is a stable reference used by .tex anchors, claim-guards.md, figure-plan.md,
#   commit messages, and reviewer correspondence. NEVER rename an id — the cross-links
#   are not automatically repaired and check_claims.py cannot tell a rename from a
#   deletion. To kill a claim, change its `status`, keep the id, and leave a comment
#   saying what it was and why it died. A ledger with tombstones in it is doing its job;
#   a ledger that only ever contained true things was written after the fact.
#
# STATUS LIFECYCLE
#   supported     evidence exists, statement is inside what the evidence licenses. Shippable.
#   overreaching  the measurement exists but the statement outruns it. BLOCKS THE BUILD
#                 until narrowed to `supported` or demoted to `retired`. Transient by design.
#   unsupported   no evidence exists and none can be produced from the current runs.
#                 Either a run must be added or the claim must go.
#   retired       was believed, is now known to be wrong/vacuous. Kept as a tombstone
#                 so it cannot be re-derived by the next person to read the CSVs.
#
#   NOTE: running check_claims.py against THIS file exits 1 with
#   `ERROR [E-OVERREACHING] voltage-only-lower-variance`. That is the demonstration, not a bug:
#   an overreaching claim is build-blocking debt, and the checker fires on it whether or not it is
#   anchored. The real HH paper must resolve it (it resolves to `retired`) before build_paper.ps1.
#   The two `unsupported` claims below emit W-UNSUPPORTED *warnings*, not errors — legitimate
#   during Claims, but they must reach zero before Submit (they fail under --strict).
#   [verified: python scripts/check_claims.py --claims examples/hh-sciml/claims.yaml --tex paper.tex]
#   Expect additional E-CLAIM-NOT-ANCHORED errors until the Draft phase anchors each supported
#   claim — those track the paper's state, not this ledger's.
#
# SCOPE IS WHERE OVER-CLAIMING DIES
#   `scope` is not a caveat and not a hedge — it is the exact experimental extent the
#   evidence covers. Write it before the statement, not after. Every number in this project
#   comes from ONE trajectory: one Iapp, one initial condition, one 100 ms window. n=5 means
#   five seeds, and a seed jointly redraws the network initialization AND the OU noise
#   realization (src/experiment.jl — the two variance sources are inseparable in these runs).
#   No statistical test was run anywhere in the codebase. Say so, every time.
#
# ---------------------------------------------------------------------------
# MACRO RECONCILIATION — READ BEFORE EDITING
# ---------------------------------------------------------------------------
# Every `macro:` below must resolve to a `name:` in paper/metrics_map.yaml, and thence to a
# `\val<Name>` in the generated paper/generated/metrics.tex.
#
# RECONCILED 2026-08-19. paper/metrics_map.yaml now holds 90 entries expanding to 286 macros, and
# EVERY `macro:` referenced below resolves: check_claims.py reports 0 errors, 0 unsupported.
# THERE IS NO OUTSTANDING MACRO WORK.
#
# This paragraph used to carry a worklist of seven macros described as "referenced here but NOT YET
# in metrics_map.yaml" (RetrainBfgsOk, SindyNTermsRetained, UdeVoltageForecastGateRmse, and the four
# Baseline/Retrain RepSeed* pairs), plus a note about WindowAblCommonEvalVRmse*. All of them were
# added during the 2026-08 review round and are verified present in metrics.tex. The list is deleted
# rather than left sitting here reading as open work; `git log -p -- paper/claims.yaml` has it if the
# per-macro provenance is ever wanted.
#
# One line of it is kept, because it is a standing trap rather than a task:
#     *** DO NOT substitute `UdeForecastGateRmse` for `UdeVoltageForecastGateRmse`. ***
#     The former filters observed:full. physics-prior-reconstructs-unobserved-gates is ABOUT the
#     voltage-only runs, so using the full-state gate error would make the claim's own subject wrong.
# Macro names are LaTeX control sequences: letters only. That is why the gCa sweep uses
# `PointFour` not `0.4`, and why seed 1111 is `RepSeed` (REP_SEED, experiments_runner.jl:58).
#
# FIGURE NAMING HAZARD — AND THE INVOCATION IT FORCES
# `figures/fig9..fig12` and `results/retrain_gca2_20k/figures/fig9..fig12` are FOUR pairs of
# colliding basenames telling OPPOSITE stories. EVERY `figure:` below is therefore a
# repo-root-relative PATH, never a bare basename.
#
#   *** check_claims.py MUST be invoked with `--figures-root .` (the repo root), NOT
#       `--figures-root figures`. ***
# check_claims.py's resolve_figure() tries `root/name` first, then falls back to a recursive
# BASENAME search (`root.rglob(stem)`). Verified live:
#     resolve_figure('figures', 'results/retrain_gca2_20k/figures/fig11_...png')
#       -> figures/fig11_calcium_coeff_recovery.png    # WRONG FILE, the baseline's, silently
#     resolve_figure('.',       'results/retrain_gca2_20k/figures/fig11_...png')
#       -> results/retrain_gca2_20k/figures/fig11_...png   # correct, via the direct hit
# With repo-root-relative paths and `--figures-root .` every reference takes the direct hit and
# the rglob fallback never runs, so no collision can occur. Bare basenames would be ambiguous
# under EITHER root — which is why none are used here.
#
# GUARD RECONCILIATION — [verified in sync, 2026-07-16]
# THIS FILE OWNS THE GUARD IDS; claim-guards.md follows. That direction is fixed by
# claim-guards.md's own "Id-sync invariant" and by the fact that this side is the machine-parsed
# one (check_claims.py validates `guard:` here; nothing parses the .md). So: to rename a guard,
# edit this file FIRST, then its `**Guard id:**` section — never the reverse.
# All 11 refs below resolve to a `**Guard id:**` section in claim-guards.md (18 defined; the 7
# unreferenced ones forbid sentences rather than qualify a claim, which is legitimate).
# Verify with the command in claim-guards.md's invariant block; `dangling (FAIL)` must print `none`.
# `guard:` is a scalar in the contract schema, so a claim can cite only ONE guard even where
# several apply; the extra ones are named in that claim's comment instead.
#
# SECTION IDS
# `section` values are node ids in the Outline phase's section tree. They must match
# outline exactly; check_claims.py routes anchors by them.
# ============================================================================

claims:

  # =========================================================================
  # RESULTS — FORECASTING (the baseline comparison)
  # =========================================================================

  - id: node-diverges
    statement: >-
      A black-box Neural ODE trained on the same data leaves the 10 mV accuracy tube within
      the first few samples past the training window, and its forecast integration blows up
      rather than degrading gracefully.
    section: results.forecasting
    kind: empirical
    evidence:
      - macro: NodeForecastRollout
      - figure: figures/fig2_neural_ode_overview.png
    scope: >-
      As published: Adam 3000 + BFGS 300, inputs = six normalised states AND raw time t.
    guard: node-no-meanstd
    status: retired
    # ===== RETIRED 2026-08-07. Not wrong about the published run, but the published run was not a
    # fair baseline, so the claim cannot carry the weight the paper put on it. Two controls
    # (node_parity.jl, 5 seeds each) separate budget from architecture:
    #   * same architecture at the UDE's own budget (Adam 5000/BFGS 300): rollout 0.548 -> 0.431 ms
    #     and V RMSE 3951 -> 7119. MORE optimisation made it WORSE. The baseline was not
    #     under-trained, so the budget objection is answered.
    #   * budget held, RAW TIME INPUT REMOVED (the system is autonomous, so a clock-reading RHS is
    #     more expressive than the physics requires and can index the training window by time):
    #     rollout 0.431 -> 19.53 ms, V RMSE median 16.88, and EXACTLY CORRECT SPIKE COUNTS on 4 of
    #     5 seeds. It does not blow up.
    # So "diverges" was an artifact of an indefensible architecture. Superseded by
    # node-failure-is-architecture-not-budget, which states the attribution and keeps the (still
    # large, still real) UDE advantage as a quantitative and reliability gap.
    # DO NOT restore "diverges", "blows up", or "impossible versus routine" anywhere. =====

  - id: ude-forecasts-accurately
    statement: >-
      The UDE, which retains all known physics and learns only the calcium current, tracks the true
      voltage across the entire un-trained remainder of the trajectory without ever leaving the 10 mV
      tube, at a sub-millivolt forecast RMSE.
    section: results.forecasting
    kind: empirical
    evidence:
      - macro: UdeForecastVRmse
      - macro: UdeForecastRollout
      - figure: figures/fig3_ude_overview.png
      - figure: figures/fig5_metrics_bar_train_vs_forecast.png
    scope: >-
      single trajectory (Iapp=10 uA/cm2, steady-state IC, 0-100 ms), gCa=2.0, OU noise level 0.02,
      train t<=30 ms (154 points), forecast t>30 ms (358 points), Adam 5000 + BFGS 300, n=5 seeds,
      no statistical test.
    guard: rollout-is-censored
    status: supported
    # UdeForecastRollout is RIGHT-CENSORED, not measured. cap_ms=70.0 (src/metrics.jl:81-82) and
    # 70 ms = 100-30 = the whole remaining trajectory, so "70.0 +/- 0.0 ms" across all 5 seeds means
    # "never breached, in any seed" — the metric is saturated and cannot discriminate. It must render
    # as ">=70 ms (capped)". A macro emitting `70.0 \pm 0.0` asserts a precision that does not exist.
    # This is why metrics_map.yaml uses `emit: ge` with `censored_at: 70.0` for this one.

  - id: ude-learns-true-dynamics-not-noise
    statement: >-
      The UDE's training-window error against the clean trajectory is well below its error against the
      noisy signal it was actually fit to, so the model recovered the underlying dynamics rather than
      interpolating the observation noise.
    section: results.forecasting
    kind: empirical
    evidence:
      - macro: UdeTrainVRmse
      - macro: UdeTrainVRmseVsNoisy
      - figure: figures/08_Noisy_Data_Comparison.png
    scope: >-
      single trajectory, gCa=2.0, OU noise level 0.02 (temporally correlated, renormalized to
      noise_level x per-channel std of the clean signal), train t<=30 ms, n=5 seeds, no statistical test.
      All metrics are scored against data_clean; V_rmse_vs_noisy is the noise-floor reference channel
      (src/metrics.jl). A model that fit the clean signal perfectly would score ~the noise std here, not 0.
    status: supported
    # This is the claim that makes every other error number interpretable, and it is nearly free —
    # the codebase already emits V_rmse_vs_noisy "for transparency". Most papers with a noisy-data
    # setup never report it and leave the reader unable to tell fitting from overfitting.

  - id: forecast-is-one-uninterrupted-rollout
    statement: >-
      Forecast error is measured as the tail of a single continuous integration from the true initial
      condition at t=0, with no re-initialization at the train/forecast boundary; it is extrapolation
      error, not one-step-ahead error.
    section: methods.evaluation
    kind: methodological
    evidence:
      - figure: figures/fig3_ude_overview.png
      - figure: figures/fig2_neural_ode_overview.png
    scope: >-
      applies to every run in the paper. solve_aligned() integrates over the full TSPAN_FULL=(0,100) ms
      from steady_state_u0(), NaN-padding any early-terminated tail (src/experiment.jl). Training
      integrates only over tspan_train.
    status: supported
    # No macro: this is a property of the protocol, not a measurement. It is in the ledger because
    # reviewers WILL assume teacher-forcing or windowed re-initialization unless told otherwise, and
    # because it is what makes `ude-forecasts-accurately` a strong result rather than a trivial one.

  - id: rep-seed-is-guarded-not-cherry-picked
    statement: >-
      The single seed used for every trajectory and parity panel was fixed before the seed spread was
      known, and is verified post-hoc to be representative of the five-seed distribution rather than
      selected from it.
    section: methods.evaluation
    kind: methodological
    evidence:
      - macro: UdeForecastVRmse
      - figure: figures/fig3_ude_overview.png
    scope: >-
      REP_SEED=1111 = B_SEED, the pre-registered baseline seed (experiments_runner.jl:58). The guardrail
      (experiments_runner.jl:417-453) takes UDE/full forecast V_rmse across the 5 seeds and passes only if
      REP_SEED is the median-closest seed OR falls inside the IQR [q1,q3]; otherwise it prints the exact
      regenerate_ude_figs(...) command to rebuild the panels from the median-closest seed's saved params.
      This is a pre-registered choice with a post-hoc representativeness check, not a selection procedure.
    status: supported

  # =========================================================================
  # RESULTS — PARTIAL OBSERVATION
  # =========================================================================

  - id: physics-prior-reconstructs-unobserved-gates
    statement: >-
      When only voltage enters the loss, the five gating variables — which are never observed, never
      scored during training, and never supervised — are nonetheless reconstructed to low error, because
      the retained gate kinetics propagate voltage information into the hidden states.
    section: results.partial-observation
    kind: empirical
    evidence:
      - macro: UdeVoltageForecastGateRmse
      - figure: figures/fig6_voltage_only_overview.png
      - figure: figures/fig6_voltage_only_s.png
    scope: >-
      single trajectory (Iapp=10 uA/cm2, steady-state IC, 0-100 ms), gCa=2.0, OU noise level 0.02,
      train t<=30 ms, n=5 seeds, forecast window, no statistical test. Voltage-only restricts the LOSS
      to row 1 (make_ude_loss selects data_noisy[1:1, train_idx]); the solver still integrates all six
      states from the full true initial condition u0 = steady_state_u0(). gate_rmse_mean is the plain
      arithmetic mean of the five per-gate RMSEs, not a pooled RMSE — each gate is weighted equally
      regardless of dynamic range.
    status: supported
    # Say "voltage-only OBSERVATION in the loss", never "only V is known" — the initial condition is
    # the full true 6-state vector in every run, and noise is added to all six channels even in the
    # voltage-only runs. Overstating the hiding is the easiest way to lose this claim in review.

  - id: voltage-only-equivalent
    statement: >-
      Restricting the loss to voltage alone matches full-state observation to within seed noise on
      forecast voltage error and on calcium-current error; we find no evidence that the additional
      state supervision helps.
    section: results.partial-observation
    kind: empirical
    evidence:
      - macro: UdeForecastVRmse
      - macro: UdeVoltageForecastVRmse
      - macro: UdeForecastICaRmse
      - macro: UdeVoltageForecastICaRmse
      - figure: figures/fig8_full_vs_voltage_metrics_bar.png
    scope: >-
      single trajectory, gCa=2.0, OU noise level 0.02, train t<=30 ms, n=5 seeds, forecast window,
      NO statistical test was run. Gaps are ~0.02 mV on V_rmse and ~0.12 uA/cm2 on ICa_rmse against
      pooled stds of ~0.09 and ~0.35 respectively. This is an equivalence-within-noise statement about
      one system at n=5; it is not a TOST, not a power analysis, and not a claim that the two are equal.
    guard: voltage-only-no-superiority
    status: supported
    # "Within seed noise" is doing real work in the statement and must survive editing. The point
    # estimates happen to favor full-state on both metrics — which is exactly the trap. At n=5 with
    # no test, the direction of a sub-sigma gap is noise. Equivalence is also the STRONGER finding:
    # "you can drop 5 of 6 observed channels for free" beats "full-state wins by 0.02 mV".
    # NOTE: this comparison cannot be made on the common_eval window — see voltage-only-common-eval-matches-full.

  - id: voltage-only-lower-variance
    statement: >-
      Voltage-only observation yields a lower-variance forecast across seeds than full-state observation.
    section: results.partial-observation
    kind: empirical
    evidence:
      - macro: UdeForecastVRmse
      - macro: UdeVoltageForecastVRmse
    scope: >-
      single trajectory, gCa=2.0, OU noise level 0.02, train t<=30 ms, n=5 seeds, forecast window,
      no variance test of any kind.
    guard: voltage-only-no-superiority
    status: retired
    # ===== RETIRED (was overreaching). The evidence is closed, so it is shrunk, not fixed:
    # the descriptive stds are folded into voltage-only-equivalent's scope and this comparative
    # claim is tombstoned (id kept). check_claims.py now passes; before demotion it exited 1 here
    # BY DESIGN, which is the mechanism working. Original kill note follows. =====
    # ===== KILLED. This is the worked example of a claim the ledger stopped. =====
    # It arose from staring at the std column of metrics_baseline_multiseed.csv and narrating it.
    # Two independent reasons it dies, and the second is the one that matters:
    #   1. The point estimates run the OTHER WAY — voltage-only's forecast V_rmse std is roughly 4x
    #      full-state's, not lower. So the statement is not merely unlicensed, it is backwards.
    #   2. Even had it pointed the right way, n=5 with no variance test licenses NO claim about spread
    #      in either direction. An F-test on 5 vs 5 has essentially no power; a 4x ratio of sample stds
    #      at n=5 is unremarkable under equal variances. The overreach is not the direction — it is that
    #      a variance comparison was attempted at all at this n.
    # Resolution: fold the observation into voltage-only-equivalent's scope (where the stds are stated
    # as descriptive context, not compared) and set this to `retired`. Left at `overreaching` here so the
    # example shows the state that blocks the build. check_claims.py exits 1 on this claim BY DESIGN.

  - id: voltage-only-common-eval-matches-full
    statement: >-
      Voltage-only and full-state observation agree on the shared common-evaluation window (t>50 ms),
      confirming the equivalence on an interval that is unseen for both.
    section: results.partial-observation
    kind: empirical
    evidence:
      - macro: CommonEvalVRmseFull
      - macro: CommonEvalVRmseVoltage
      - macro: CommonEvalICaRmseFull
      - macro: CommonEvalICaRmseVoltage
    scope: >-
      gCa=2.0, OU noise 0.02, train t<=30 ms, n=5 seeds, window t>50 ms which is unseen for BOTH
      conditions. V RMSE 0.266+/-0.037 (full) vs 0.289+/-0.137 (voltage-only); ICa RMSE 1.251+/-0.212
      vs 1.382+/-0.478. Overlapping in both cases, so this is an equivalence-within-noise statement
      and NOT an ordering; no statistical test was run and n=5 would support none. Note the
      voltage-only SD is the larger of the two in both metrics.
    guard: no-commoneval-voltage
    status: supported
    # ===== DISCHARGED 2026-08-10, WITHOUT A RETRAIN. =====
    # The rows did not exist because run_experiment was called without common_eval_start for this
    # family. But the trained weights were saved, so recover_voltage_only_commoneval.jl reloads each
    # network, re-solves the full span, and scores on common_eval_indices() -- exactly what
    # compute_metrics would have emitted had the kwarg been passed. The script SELF-TESTS by also
    # recomputing the forecast window and matching metrics_all.csv to a relative difference of 0,
    # which is what licenses trusting the common-eval numbers it produces alongside them.
    # Output: results/identifiability/voltage_only_commoneval.csv (isolated; metrics_all.csv is not
    # appended to, because that file is the input to already-published \val macros).
    # Original tombstone note, kept for the record:
    # ===== NO EVIDENCE EXISTS AND NONE CAN BE EXTRACTED. =====
    # run_experiment is called WITHOUT common_eval_start for the voltage-only runs
    # (experiments_runner.jl:110-115), so metrics_all.csv contains zero common_eval rows for
    # observed=voltage — only the UDE/full baseline and the window ablation emit that window at all.
    # This claim is in the ledger, with empty evidence and this comment, for one reason: it is the
    # obvious next thing a reader (or a co-author, or the drafting model) will try to write, and the
    # absence is invisible unless you go looking. A tombstone here costs nothing; silently pooling the
    # forecast window and calling it common_eval costs the paper.
    # To make it supported: re-run the voltage-only family passing common_eval_start=COMMON_EVAL_START.
    # Until then it must not appear in the .tex in any form.

  - id: calcium-error-is-decoupled-from-trajectory-error
    statement: >-
      The calcium-current error and the voltage forecast error measure different objects: the learned
      closure is probed at the true clean (V,s) and so its error is a function-approximation error,
      whereas voltage error accumulates over a free rollout.
    section: methods.metrics
    kind: methodological
    evidence:
      - macro: UdeForecastICaRmse
      - figure: figures/fig3_ude_calcium_parity.png
    scope: >-
      applies to every UDE run. ICa_nn is evaluated at data_clean's (V,s) (src/experiment.jl:391-393);
      V_rmse comes from the free 100 ms rollout from u0. ICa_rmse / ICa_rmse_norm exist for model=UDE
      only — the NODE has no calcium closure and emits no such rows.
    status: supported
    # Load-bearing for the whole identifiability argument: it is precisely because a good closure error
    # and a good trajectory error are separable that "great voltage, wrong coefficients" is coherent
    # rather than a contradiction. Also: ICa_rmse_norm's denominator is std(ICa_true) recomputed
    # PER WINDOW, so train and forecast values use different normalizers and are not comparable to
    # each other. Compare across gCa within a window (which is what gca-sweep-shows-nonidentifiability does).

  # =========================================================================
  # RESULTS — SYMBOLIC RECOVERY
  # =========================================================================

  - id: symbolic-form-recovered
    statement: >-
      The learned neural closure is well approximated by the expected biophysical conductance form:
      when the form s^2(aV+b) is SUPPLIED to a constrained fit, the fitted curve tracks the CLOSURE's
      own output with R^2 = 0.985 +/- 0.009 on the supervised trajectory (lower and far more
      seed-dependent on the convex hull, 0.936 +/- 0.075, worst seed 0.816), and the same curve
      reproduces the true calcium current with high R^2 against the analytic ground truth. This is
      agreement with an assumed form, not discovery of it — unconstrained symbolic regression over an
      open library does not recover the form reliably (see sindy-does-not-sparsify).
    section: results.symbolic-recovery
    kind: empirical
    evidence:
      - macro: SymbolicRTwoNnTrajTrain
      - macro: SymbolicRTwoNnHull
      - macro: SymbolicRTwoCondTrue
      - macro: SymbolicRTwoTrajTrain
      - figure: figures/fig9_calcium_symbolic_parity.png
      - figure: figures/fig10_calcium_symbolic_timeseries.png
    scope: >-
      gCa=2.0, OU noise level 0.02, train t<=30 ms, n=5 seeds, per-seed mean +/- std (ddof=1), no
      statistical test. The fit is a 2-column no-intercept OLS on the 80x80 grid probe masked to the
      convex hull of the training trajectory's (V,s) cloud (22120 of 32000 pooled points survive);
      r2_cond_true is then scored on the 512-point trajectory. The gate power s^2 and the linear
      driving force are HARD-CODED by the estimator — this is a recovery test within the true model
      class, not a discovery test. See sindy-does-not-sparsify for the open-library result.
      The SymbolicRTwoNn* pair is a DIFFERENT column of a DIFFERENT file: the domain-robustness
      refit (scripts/symbolic_domain_comparison.py, results/identifiability/symbolic_domain_comparison.csv)
      runs the same 2-column no-intercept OLS on the supervised trajectory (n=154 points) and on the
      hull grid and scores it against the NETWORK's own output on that same domain, column
      r2_vs_nn_on_domain, not against the analytic current. Only that column measures how well the
      two-term form describes the closure; r2_vs_true_on_domain and r2_cond_true measure how well it
      describes the truth, which is a different question and the one the earlier draft answered.
    guard: r2-ens-is-uninformative
    status: supported
    # ===== REWORDED 2026-08-07 (review point 2). The mentor's objection is correct and conceded:
    # "the conductance form s2(aV+b) is supplied to the constrained regression rather than
    # discovered. Since the unconstrained SINDy fit retains all terms, the accurate claim is that the
    # neural closure can be APPROXIMATED BY the expected conductance form, but unconstrained symbolic
    # discovery does not recover it reliably."
    # BANNED PHRASINGS anywhere in the paper: "recovers the functional form", "discovers the
    # conductance form", "the form is recovered". Permitted: "is well approximated by", "is
    # consistent with", "agrees with the assumed form". The distinction is the difference between a
    # discovery claim and a goodness-of-fit claim, and only the latter is earned. =====
    # Quote r2_cond_true (per-seed mean +/- std), NEVER R2_ens=0.997. R2_ens is measured on the pooled
    # hull grid rather than the trajectory, and it is nearly blind: across the aggressive retrain it
    # moved 0.997333 -> 0.997341 (5th decimal) while per-seed R^2 collapsed 0.984 -> 0.845. A statistic
    # that cannot detect that collapse must not headline the recovery quality.

  - id: symbolic-coefficients-not-identifiable
    statement: >-
      The coefficients read off the neural closure are only order-correct: the fitted conductance
      scatters across seeds by more than half its own magnitude and its mean sits well away from the
      true value, so the calcium conductance is not recoverable THROUGH THE LEARNED CLOSURE.
    section: results.symbolic-recovery
    kind: empirical
    evidence:
      - macro: SymbolicAHat
      - macro: SymbolicAHatTrajTrain
      - figure: figures/fig11_coeff_recovery_before.png
    scope: >-
      gCa=2.0, OU noise level 0.02, train t<=30 ms, n=5 seeds, per-seed mean +/- std (ddof=1), no
      statistical test. a_true=gCa=2.0. Per-seed a_hat spans 0.673 -> 3.095 (4.6x) on the hull domain
      and 1.241 -> 2.816 on the strictly supervised trajectory; the std is 41-57% of the mean
      depending on domain. Erev = -b/a is a pooled point estimate with no error bar.
    guard: a-hat-not-a-recovery
    status: supported
    # ===== REWORDED 2026-08-07. The OLD statement ended "...not identifiable from this
    # trajectory", which the parametric fit falsifies: fitting (gCa, ECa) directly on the SAME
    # trajectory returns 2.09 +/- 0.13 (parametric-fit-identifies-conductance). The data DO
    # determine the conductance. What fails is recovery *via the closure*, so the claim is now
    # scoped to the closure and the causal reading lives in closure-induced-nonidentifiability.
    # Do not restore "not identifiable from this trajectory" anywhere in the paper. =====
    # "a = 1.60 +/- 0.90 vs true 2.0" is NOT a recovery and the interval containing 2.0 is not a defense —
    # an interval that wide contains almost anything. State the per-seed span, not just the std.
    # fig11 caption must say panel 3 (Erev) is a pooled point estimate: the missing whisker will
    # otherwise read as zero uncertainty on the single most-wrong number in the paper (162.5 vs 120 mV).
    # The ratio genuinely cannot carry a per-seed error bar — it blows up when a is small — which is
    # itself a symptom of the non-identifiability, and worth one sentence.

  - id: sindy-does-not-sparsify
    statement: >-
      Sparse regression on an open six-term library recovers no sparse equation: every term is retained
      at every seed, the true V*s^2 term is fitted with the wrong sign, and the physical structure is
      smeared across correlated low-order terms — yet the resulting fit still predicts the true current
      well.
    section: results.symbolic-recovery
    kind: empirical
    evidence:
      - macro: SindyNTermsRetained
      - figure: figures/fig9_calcium_symbolic_parity.png
    scope: >-
      gCa=2.0 (5 seeds) and gCa=0.4 (1 seed) = all 6 configs. STLSQ with tau=0.05, <=20 iterations,
      selection on the z-standardized library with the constant column exempt from thresholding
      (so nactive>=1 by construction), then OLS debiasing on the raw columns. Library is
      {1, V, s, V*s, s^2, V*s^2} — the truth 2*V*s^2 - 240*s^2 is exactly representable in it.
      Fit on the hull-masked grid probe, scored on the trajectory. Single-seed at gCa=0.4.
    guard: sindy-r2-is-not-identifiability
    status: supported
    # The code's own verdict is the right framing: "the two physical terms dominate, but the fit does not
    # fully sparsify: the network's small departures from the exact form leak into the correlated
    # low-order terms (an identifiability limit, not a code issue)." Do not report the SINDy R^2 as a
    # success — R^2=0.9876 with V*s^2 at coefficient -1.469 against a true +2.0 is the paper's cleanest
    # single illustration that predictive accuracy and identifiability are different properties.

  - id: regression-machinery-is-sound
    statement: >-
      The recovery pipeline is exonerated by a control: regressing the same estimator, on the same
      hull-restricted domain, against the analytic calcium current returns the true coefficients
      exactly — so the coefficient gap is a property of the network, not of the fitting procedure.
    section: results.symbolic-recovery
    kind: methodological
    evidence:
      - figure: figures/fig9_calcium_symbolic_parity.png
    scope: >-
      gCa=2.0, the same convex-hull-masked 80x80 grid domain and the same no-intercept 2-column OLS
      fit_conductance() used for every reported coefficient. Target is the analytic gCa*s^2*(V-ECa)
      instead of the network output. Returns a=2.0000, b=-240.00 against expected (2.0, -240).
    status: supported
    # ===== EVIDENCE GAP — DELIBERATE, AND THE REASON THIS CLAIM IS WORTH READING. =====
    # This is the claim that rules out the trivial explanation ("your regression is broken"), and it is
    # the single most load-bearing control in the paper. Its numbers are NOT in any CSV: the sanity fit
    # is a console print at objective3_symbolic.jl:208-209
    #   [sanity] fitting the TRUE current on the same domain: a=%.4f b=%.2f (expect 2.0, -240)
    # and symbolic_recovery_metrics.csv has no column for it. So NO MACRO CAN EXIST YET, and the
    # evidence line above is a figure that is only indirect support.
    # The a=2.0000 / b=-240.00 above are [verified] by independent recomputation from the raw grid
    # probe (results/calcium/grid_ude_full_seed1111.csv): OLS of the ANALYTIC ICa_true on
    # [V*s^2, s^2] returns a=2.0000, b=-240.00 both on the full 6400-point grid and on the
    # hull-masked subset (4424 points; 4424 x 5 seeds = 22120, matching the pooled count this
    # ledger quotes elsewhere). This is exact rather than approximate for a structural reason worth
    # one sentence in the paper: the truth gCa*s^2*(V-ECa) lies EXACTLY in the estimator's 2-column
    # span, so OLS recovers it to machine precision on ANY subset of the domain. The control is
    # therefore about the DOMAIN and the MASK, not about numerical luck.
    # This is exactly what the Evidence phase is for: the correct output here is a WORK ITEM, not a
    # shrug. Persist the sanity fit to results/symbolic/sanity_fit.csv (columns: gCa, a_san, b_san),
    # add macros SymbolicSanityAHat / SymbolicSanityBHat to metrics_map.yaml, and add them here.
    # Until that lands, the .tex sentence quoting a=2.0000, b=-240.00 must carry:
    #   % numok: console output of objective3_symbolic.jl:208-209; not yet a table cell — see claims.yaml
    # `% numok` is an escape hatch with a receipt, not a way to launder a number. Every one of them is
    # a debt, and this ledger is where the debt is recorded.

  - id: ensemble-fit-corroborates-per-seed
    statement: >-
      A pooled fit across all five seeds independently corroborates the per-seed mean coefficients.
    section: results.symbolic-recovery
    kind: empirical
    evidence:
      - macro: SymbolicAHat
    scope: >-
      gCa=2.0, 5 seeds, pooled hull-masked grid (22120 points).
    guard: ensemble-is-not-independent
    status: retired
    # ===== TOMBSTONE. This was believed, drafted, and is algebraically vacuous. =====
    # It was written because learned_calcium_equation.txt reports "per-seed a = 1.596 +/- 0.905" and
    # "ensemble a ~ 1.596" on adjacent lines, and two agreeing estimates look like corroboration.
    # They are ONE estimate printed twice. All 5 seeds share gCa=2.0, hence one clean trajectory, one
    # convex hull, one grid — hence THE SAME DESIGN MATRIX. Stacking an identical Phi five times and
    # solving once gives (5 Phi'Phi)^-1 Phi'(sum y_i) = mean(beta_i) exactly. a_ens IS mean(a_hat), to
    # every printed digit, by construction and not by luck. Presenting them side by side would have
    # double-counted one number in the paper's most scrutinized table.
    # What survives: Erev_ens = -mean(b)/mean(a) is genuinely different from mean(-b_i/a_i), because a
    # ratio of means is not a mean of ratios — and pooling is the right call there precisely because the
    # per-seed ratio explodes when a is small. That is the code's actual (correct) stated rationale.
    # Frame it as "reversal potential computed from the mean coefficients rather than as a mean of
    # per-seed ratios". Never as an ensemble fit, and never as corroboration.
    # Retired, not deleted: the two adjacent lines in that .txt file will re-tempt the next reader.

  # =========================================================================
  # RESULTS — IDENTIFIABILITY (the two controls + the headline)
  # =========================================================================

  - id: gca-sweep-shows-nonidentifiability
    statement: >-
      Recovery of the hidden current through the closure improves as the calcium conductance is raised:
      normalized calcium error falls by roughly eightfold across the sweep while forecast voltage error
      is unchanged, so how well the hidden term is recovered is governed by how much it moves the
      observed channel and not by how well the observed channel is fitted.
    section: results.identifiability
    kind: empirical
    evidence:
      - macro: GcaSweepICaNormPointFour
      - macro: GcaSweepICaNormOne
      - macro: GcaSweepICaNormTwo
      - macro: GcaSweepICaNormFour
      - macro: GcaSweepVRmsePointFour
      - figure: figures/fig7c_ablation_gca_5seed.png
    scope: >-
      gCa in {0.4, 1.0, 2.0, 4.0}, OU noise level 0.02, train t<=30 ms, forecast window, and now
      n=5 SEEDS AT EVERY POINT (mean +/- sd, ddof=1): 0.724+/-0.318, 0.312+/-0.097, 0.140+/-0.025,
      0.093+/-0.044. Only the 1.0->2.0 step clears 2 pooled SD (ratio 2.4); 0.4->1.0 (1.8) and
      2.0->4.0 (1.3) do NOT. The claim is therefore the END-TO-END trend (0.4 vs 4.0, ~8x, far
      outside noise), never an individual step. No statistical test.
    guard: ablations-are-n1
    status: supported
    # ===== REWORDED 2026-08-07 after repeating the sweep over all five seeds (review point 5b).
    # TWO THINGS THE OLD VERSION GOT WRONG, both now forbidden:
    #  1. "at the physiological value the closure's error EXCEEDS the true current's own variation"
    #     rested on the single-seed 1.179 — which turned out to be the WORST of the five seeds. The
    #     five-seed mean is 0.724 and only 1 of 5 exceeds unity. Do not say "exceeds one"; say it
    #     approaches unity, and give the spread.
    #  2. The old scope judged every point against the +/-0.025 seed spread measured at gCa=2.0.
    #     The spread at gCa=0.4 is +/-0.318 — 13x larger. Calibrating a low-signal point against a
    #     high-signal point's noise understated the uncertainty badly. Each point now carries its own.
    # STILL TRUE and still the reason the axis matters: signal amplitude is the ONLY thing that
    # changes across it (same architecture, data volume, optimizer, iterations).
    # NEW and worth stating: the RAW ICa error is statistically flat across the sweep
    # (GcaSweepICaRawPointFour 1.273+/-0.560 vs GcaSweepICaRawTwo 1.189+/-0.208, intervals
    # overlapping). The closure's absolute error barely moves; only the signal grows. That is a
    # cleaner mechanism statement than the normalised metric alone and only 5 seeds could show it.
    # At gCa=0.4 the symbolic fit still returns the WRONG SIGN (a=-0.372 vs true +0.40), and the
    # parametric fit at the same conductance recovers 0.438+/-0.065 — the sharpest contrast in the
    # paper. See parametric-fit-identifies-conductance.

  - id: gca-two-is-a-controlled-choice
    statement: >-
      The main setting uses a calcium conductance above the physiological value deliberately, as the
      regime in which the closure is identifiable at all; the sweep down to the literature value is
      reported in full and shows recovery failing there.
    section: methods.experimental-design
    kind: methodological
    evidence:
      - macro: GcaAblICaNormTwo
      - macro: GcaAblICaNormPointFour
      - figure: figures/fig7c_ablation_gca_5seed.png
    scope: >-
      gCa is a builder argument to make_hh_advanced(gCa), never a model constant and never visible to
      the UDE — it shapes only the TRUE data being fitted. Swept over {0.4, 1.0, 2.0, 4.0} with all
      other axes pinned to baseline, n=5 seeds at every point. gCa=0.4 is the physiological value;
      gCa=2.0 is the
      main setting. Everything else in the paper is reported at gCa=2.0.
    status: supported
    # ===== THIS IS THE ANSWER TO "you tuned gCa until your method worked." =====
    # It is a real objection and it will be raised. The answer is not a denial, it is the sweep: the
    # unfavorable value is measured, reported, plotted, and given its own negative-control panel
    # (fig12, right). A paper that picks gCa=2.0 and stays silent has tuned a hyperparameter. A paper
    # that picks gCa=2.0, shows the method FAILS at gCa=0.4, and makes that failure the central finding
    # has chosen a regime and characterized its boundary.
    # Write the honest version in Methods, before Results, in the researcher's own voice. Reviewers
    # forgive a limitation they are told about and punish one they discover.

  - id: retrain-does-not-close-gap
    statement: >-
      Quadrupling the optimization budget does not close the coefficient gap: every recovery quantity
      gets worse and noisier, while the optimizer demonstrably converges — so the gap is a property of
      the CLOSURE, not of under-training and not of the data. (The single trajectory does determine
      the conductance to about 6% - see parametric-fit-identifies-conductance, gCa 2.092 +/- 0.130
      against a true 2.0. The retired reading, "the data cannot determine it", must not be restored
      here.)
    section: results.identifiability
    kind: empirical
    evidence:
      - macro: RetrainAHat
      - macro: RetrainRTwoCondTrue
      - macro: RetrainForecastVRmse
      - macro: RetrainFinalLoss
      - macro: RetrainBfgsOk
      - figure: figures/fig11_coeff_recovery_after.png
    scope: >-
      gCa=2.0, full-state observation only, OU noise level 0.02, train t<=30 ms, n=5 seeds.
      Adam 20000 + BFGS 1000 vs the baseline's 5000 + 300; identical network, ADJOINT, Tsit5, 1e-8
      tolerances, loss, and seeds — ONLY the iteration budget and the output directory changed.
      No statistical test. Voltage-only, the NODE, and the other ablations were not retrained.
    status: supported
    # ===== THE SECOND CONTROL, AND THE STRONGEST SINGLE RESULT IN THE PROJECT. =====
    # The convergence evidence is what makes it a control rather than a failed run: bfgs_ok=true for all
    # 5 seeds and final_loss=29.66 +/- 2.66 (tight). The optimizer did its job. It converged to DIFFERENT
    # closures that fit the same training voltage equally well. That is the textbook non-identifiability
    # signature, and it is why "just train longer" is not an available rebuttal.
    # Report bfgs_ok explicitly: train_two_stage wraps BFGS in try/catch and degrades silently to the
    # Adam result with only an @warn, so bfgs_ok=false would make "we ran a two-stage schedule" false.
    # What got worse: a_hat 1.596->1.495 (further from 2.0) with std inflated 1.6x, b_hat std 2.3x,
    # per-seed R^2 0.984->0.845, Erev 162.5->171.3 mV, and the physical s^2 term dropped entirely for
    # 2 of 5 seeds. Do NOT also cite the retrain's gCa=0.4 row — see retrain-negative-control-replicates.

  - id: retrain-seed-decoupling
    statement: >-
      On the representative seed the aggressive retrain leaves forecast voltage accuracy essentially
      unchanged while the recovered closure's agreement with the true calcium current collapses: the
      same trajectory quality is achieved by a different, and no better, closure.
    section: results.identifiability
    kind: empirical
    evidence:
      - macro: BaselineRepSeedForecastVRmse
      - macro: RetrainRepSeedForecastVRmse
      - macro: BaselineRepSeedRTwoCondTrue
      - macro: RetrainRepSeedRTwoCondTrue
      - figure: results/retrain_gca2_20k/figures/fig10_calcium_symbolic_timeseries.png
    scope: >-
      gCa=2.0, full-state observation, OU noise level 0.02, train t<=30 ms, SEED 1111 ONLY (n=1;
      this is a within-seed before/after on the representative seed, not a distributional claim).
      Baseline Adam 5000 + BFGS 300 vs retrain Adam 20000 + BFGS 1000. Forecast V-RMSE 0.219 -> 0.251
      (roughly unchanged, and within the +/-0.028 five-seed baseline spread); r2_cond_true 0.988 -> 0.580.
    status: supported
    # ===== THE CLINCHER. If the paper has one sentence, it is this one. =====
    # Aggregate before/after tables invite "everything got worse, so the retrain was just bad."
    # This decouples the two axes ON THE SAME SEED: the voltage the loss can see is reproduced just as
    # well as before, and the closure that reproduces it has become dramatically less like the true
    # calcium current. Trajectory quality and closure identity moved INDEPENDENTLY. That is what
    # non-identifiability MEANS — a flat direction in the loss along which the closure can wander while
    # the observable stays put — and here it is, observed directly rather than inferred from a table.
    # n=1 by construction and the scope says so. Its job is to exhibit the mechanism; retrain-does-not-
    # close-gap (n=5) carries the distributional weight. Neither claim can do the other's job.

  - id: retrain-negative-control-replicates
    statement: >-
      The aggressive retrain reproduces the gCa=0.4 recovery failure, confirming it is not an artifact
      of the baseline training budget.
    section: results.identifiability
    kind: empirical
    evidence:
      - macro: GcaFourRetrainAHatBefore
      - macro: GcaFourRetrainAHatAfter
      - macro: GcaFourRetrainRTwoBefore
      - macro: GcaFourRetrainRTwoAfter
    scope: >-
      gCa=0.4, seed 1111 (matching the single-seed baseline negative control), Adam 20000 / BFGS
      1000 against the baseline's 5000/300, everything else identical. On the convex-hull domain the
      conductance goes -0.372 -> -1.341 against a true +0.4 and R^2 against the true current goes
      0.688 -> -0.331, i.e. wrong-signed under both budgets and markedly worse after. On the
      supervised trajectory both estimates are indistinguishable from zero (-0.061 -> +0.021), so
      the nominal sign change there carries no information and MUST NOT be read as recovery. n=1;
      no statistical test.
    guard: retrain-gca-point-four-is-copied
    status: supported
    # ===== DISCHARGED 2026-08-10, AND THE ARTIFACT REMOVED. =====
    # retrain_gca2_20k.jl now takes RETRAIN_GCA / RETRAIN_SEEDS / RETRAIN_OUT (all defaulting to the
    # published configuration, so the original gCa=2.0 run stays byte-reproducible) and SKIPS the
    # baseline-probe copy whenever gCa != 2.0. The genuine run is results/retrain_gca04_20k/; its
    # probe is verifiably NOT a copy (differing checksum against the baseline file).
    # WHAT THE CONTROL SHOWS: the physiological failure is not a training-budget artifact either.
    # Four times the optimisation makes it worse, not better, and drives R^2 below zero - the
    # distilled form becomes a worse predictor of the true current than that current's own mean.
    # WHAT IT DOES NOT SHOW: any recovery on the supervised trajectory. Both budgets return
    # essentially zero there. The estimator finds nothing to fit because there is almost nothing of
    # the calcium current in the voltage at this conductance - which is the sweep's point.
    # Original tombstone note, kept for the record:
    # ===== NO EVIDENCE. THE "AFTER" FILE IS A COPY OF THE "BEFORE" FILE. =====
    # retrain_gca2_20k.jl retrains the 5 headline seeds at gCa=2.0 ONLY. It then cp()s
    # results/calcium/{probe,grid}_abl_gca_0.4_seed1111.csv into its own tree (lines 136-143) so the
    # redirected Objective 3 can find its negative control in one place. The consequence: the gCa=0.4
    # row of results/retrain_gca2_20k/symbolic/symbolic_recovery_metrics.csv is BYTE-IDENTICAL to the
    # baseline's, and the two learned_calcium_equation.txt files print identical gCa=0.4 lines
    # (a=-0.372, b=-89.2, R2=0.7806).
    # This is the most dangerous artifact in the repository, because it looks exactly like a successful
    # replication: a before/after table with matching numbers in the control row reads as robustness.
    # It is one number in two directories. Anyone comparing the two output trees will find it and, if
    # the paper does not say otherwise, will assume the paper is claiming it.
    # To make it supported: retrain at gCa=0.4 with the 20000/1000 budget. Cheap, and it would make the
    # identifiability argument airtight at the physiological value. Until then: not in the .tex.

  - id: ude-recovers-trajectory-not-coefficients
    statement: >-
      The UDE recovers the trajectory but not the hidden current's coefficients: voltage is forecast to
      sub-millivolt accuracy over the whole un-trained remainder, and the closure agrees closely with
      the true current's shape, while the calcium conductance read off it is only order-correct — and
      neither a signal-amplitude sweep nor a fourfold optimisation budget closes that gap.
    section: results.identifiability
    kind: empirical
    evidence:
      - macro: UdeForecastVRmse
      - macro: SymbolicRTwoCondTrue
      - macro: SymbolicAHat
      - macro: GcaSweepICaNormPointFour
      - macro: RetrainAHat
      - figure: figures/fig11_coeff_recovery_before.png
      - figure: figures/fig12_calcium_identifiability.png
    # REWORDED 2026-08-07: dropped "the conductance is not identifiable from a single trajectory"
    # (falsified by parametric-fit-identifies-conductance) and softened "recovers the functional
    # form" to agreement with the true current's shape (review point 2). Swapped the retired
    # single-seed GcaAbl* macro for the five-seed GcaSweep* one.
    scope: >-
      ONE trajectory: one Iapp=10 uA/cm2, one steady-state initial condition, one 100 ms window,
      512 samples. gCa=2.0 for the headline (the sweep covers {0.4,1.0,2.0,4.0} at n=5); OU noise
      level 0.02; train t<=30 ms; n=5 seeds for every mean +/- std, where a seed jointly redraws the
      network initialization and the OU noise realization. No statistical test was run anywhere.
      The UDE retains all known physics and learns only I_Ca(V,s); gCa, ECa, and the form s^2(V-ECa)
      are the only unknowns. "Not identifiable" means: not identifiable FROM THIS TRAJECTORY.
    guard: a-hat-not-a-recovery
    status: supported
    # ===== THE PAPER HEADLINE. It is a negative result and it must be framed as a finding. =====
    # This claim is a conjunction, and every conjunct is load-bearing:
    #   (a) the trajectory IS recovered            -> ude-forecasts-accurately
    #   (b) the FORM is recovered                  -> symbolic-form-recovered
    #   (c) the COEFFICIENTS are not              -> symbolic-coefficients-not-identifiable
    #   (d) it is not the regression's fault       -> regression-machinery-is-sound
    #   (e) it is not the signal amplitude's fault -> gca-sweep-shows-nonidentifiability
    #   (f) it is not the optimizer's fault        -> retrain-does-not-close-gap, retrain-seed-decoupling
    # (d)-(f) are what turn "our method didn't fully work" into "here is a property of the problem."
    # Without them this is a failure report. With them it is a characterization, and the honest version
    # is more useful to the field than the version where the coefficients came out at 2.0.
    # The "from a single trajectory" qualifier belongs in the ABSTRACT, not only in Limitations.

  # =========================================================================
  # RESULTS — ABLATIONS
  # =========================================================================

  - id: window-needs-sufficient-length
    statement: >-
      A training window that covers too little of the dynamics degrades forecast accuracy roughly
      sevenfold on the shared evaluation interval; beyond that threshold, the differences between
      window lengths do not clear seed noise.
    section: results.ablations
    kind: empirical
    evidence:
      - macro: WindowAblCommonEvalVRmseFifteen
      - macro: WindowAblCommonEvalVRmseThirty
      - figure: figures/fig7b_commoneval_ablation_window.png
    scope: >-
      single trajectory, gCa=2.0, OU noise level 0.02, t_train_end in {15,20,30,40,50} ms,
      n=1 SEED (1111), no error bars, no statistical test. Scored on the common_eval window (t>50 ms),
      which is unseen for every window length in the sweep — this is the un-confounded comparison.
      common_eval_V_rmse = 1.559 / 0.225 / 0.236 / 0.367 / 0.418 for t_train_end 15/20/30/40/50
      [verified by recomputation]. The t_train=15 collapse is 6.6x the t_train=30 value (6.9x vs
      t_train=20) — "sevenfold", NOT "an order of magnitude": that phrase overstates it by ~50%.
      Judged against the +/-0.028 five-seed spread at the shared centre point t_train=30, ONLY the
      t_train=15 collapse is safely outside seed noise. Every other adjacent gap is comparable
      to the spread.
    guard: window-nonmonotonicity-is-artifact
    status: supported
    # TWO traps, both fatal if missed:
    # 1. Use fig7b_commoneval_ablation_window.png, NOT fig7b_ablation_window.png. The latter scores each
    #    window on a DIFFERENT interval (the forecast window shifts with t_train_end) and is confounded
    #    by construction. The two files differ by one word in the filename and tell different stories.
    # 2. The 40/50 ms points score WORSE than 20/30 ms. This is a fixed-iteration optimization artifact:
    #    every window trains for the same Adam 5000 / BFGS 300 regardless of how many points it must fit,
    #    so longer windows are UNDER-OPTIMIZED, not intrinsically harder. The common_eval variant removes
    #    the shifting-window confound but NOT this one. The caption must say so, or the figure argues the
    #    opposite of the truth — that more data hurts. It does not; the budget was held fixed while the
    #    problem grew. This is a standing project finding, not a hypothesis.
    # Note also: at t_train_end=50 the common_eval and forecast columns are byte-identical by construction
    # (both select t>50). That point is not an independent check.

  - id: noise-ablation-degrades-gracefully
    statement: >-
      Recovery of the hidden calcium current degrades smoothly with observation noise and does not
      become exact when the noise is removed: the normalised calcium error rises monotonically across
      the swept noise levels and is still non-zero on noiseless data.
    section: results.ablations
    kind: empirical
    evidence:
      - macro: NoiseAblICaNormZero
      - macro: NoiseAblICaNormTwoPct
      - macro: NoiseAblICaNormTenPct
      - macro: NoiseAblVRmseZero
      - macro: NoiseAblVRmseTenPct
      - figure: figures/fig7_ablation_noise.png
    scope: >-
      single trajectory, gCa=2.0, t_train_end=30 ms, full-state UDE, forecast window, n=1 SEED (1111),
      no error bars, no statistical test. noise_level in {0.0, 0.01, 0.02, 0.05, 0.10}; the 0.02 row is
      the SHARED BASELINE centre point inherited from the headline run, not a fifth ablation run.
      forecast_ICa_rmse_norm = 0.012 / 0.052 / 0.112 / 0.191 / 0.679 and forecast_V_rmse = 0.046 /
      0.219 / 0.219 / 0.329 / 1.091 [read from results/ablation_noise.csv]. Adjacent ICa gaps are
      0.040 / 0.060 / 0.079 / 0.488 against the +/-0.025 five-seed spread at the centre point, so the
      end-to-end trend is safe and the low-end steps are only ~2-3 SD at n=1. forecast_rollout_horizon_ms
      is 70.0 (the cap) on all five rows, so that metric is saturated and discriminates nothing here.
      The symbolic distillation was NOT re-run at any noise level other than the baseline, so this
      claim says nothing about coefficient recovery.
    status: supported
    # ===== ADDED 2026-08-20. The sweep existed at experiments_runner.jl:124-131, its CSV at
    # results/ablation_noise.csv and its figure at figures/fig7_ablation_noise.png from the first run,
    # and not one sentence of the paper mentioned it. The ZERO-NOISE point is the noiseless control the
    # rest of the paper implies and never states; do not let it be dropped again.
    # TRAP: fig7_ablation_noise.png has THREE panels (V RMSE, gate RMSE, rollout horizon) and does NOT
    # plot the calcium error -- ablation_fig() is called without extra_metric at experiments_runner.jl:325
    # (only the gCa call at :322-324 passes extra_metric="ICa_rmse_norm"). Any caption saying the figure
    # shows calcium identifiability is false.

  # =========================================================================
  # DISCUSSION
  # =========================================================================

  - id: predictive-accuracy-is-not-identifiability
    statement: >-
      Across every experiment, closures that reproduce the observable trajectory to high accuracy differ
      substantially from one another and from the truth in their coefficients — predictive accuracy on
      the observed channel is not evidence that a learned physical term has been identified.
    section: discussion.implications
    kind: interpretive
    evidence:
      - macro: SindyNTermsRetained
      - macro: SymbolicAHat
      - macro: RetrainRTwoCondTrue
      - figure: figures/fig9_calcium_symbolic_parity.png
    scope: >-
      an interpretation of this paper's runs, all on one HH-type system, one trajectory, gCa=2.0 for the
      headline, n=5 seeds. Supported here by three independent instances: (i) SINDy attains high R^2
      against the true current while fitting V*s^2 with the wrong sign; (ii) five seeds reach
      indistinguishable forecast accuracy with conductances spanning 4.6x; (iii) the retrain holds
      forecast accuracy on the representative seed while r2_cond_true collapses. No statistical test.
    status: supported
    # The most transferable thing in the paper, and the part a SciML audience will actually act on:
    # parity plots and rollout RMSE — the two things UDE papers report — are exactly the diagnostics
    # that cannot see this failure. Do not soften it into "may not always imply". State it, cite the
    # three instances, and bound it in scope.

  - id: identifiability-is-the-general-lesson
    statement: >-
      Where a UDE's learned term is intended to be interpreted rather than merely simulated, its
      identifiability should be established before its coefficients are read as physical quantities —
      and the relevant question is not only whether the data determine the parameter, but whether they
      still determine it once the term is represented by a flexible closure.
    section: discussion.implications
    kind: interpretive
    evidence:
      - macro: SymbolicAHat
      - macro: ParamFitGcaHatTwo
      - macro: GcaSweepICaNormPointFour
      - macro: RetrainAHat
      - figure: figures/fig12_calcium_identifiability.png
    # REWORDED 2026-08-07. The old ending — "a single trajectory can be sufficient to fit and
    # insufficient to identify" — is exactly backwards here: the single trajectory WAS sufficient to
    # identify (2.09 +/- 0.13 parametrically). The transferable lesson is about the representation,
    # not the data budget. The cheap diagnostic the paper recommends changes accordingly: a
    # seed-spread check on the recovered coefficients, and where the form is known, a parametric fit
    # as a reference point.
    scope: >-
      GENERALIZATION FROM ONE SYSTEM. Everything in this paper is one HH-type model, one Iapp, one
      initial condition, one 100 ms window, one 337-parameter closure over (V,s), one noise process,
      one optimizer schedule. We did not vary the system, the stimulus protocol, the architecture, or
      the closure's input set. We show that the non-identifiability HERE is not caused by the
      regression, the signal amplitude, or the optimization budget — we do NOT show that it is generic,
      and we have no evidence about which of these axes would fix it. The mechanism (a flat direction in
      the loss along which the closure varies while the observable does not) is general; its presence in
      any other system is a hypothesis this paper does not test.
    guard: single-trajectory-scope
    status: supported
    # An interpretive claim earns its place only if its scope is more honest than its statement is
    # ambitious. The failure mode is the Discussion section that quietly promotes "we found X in one
    # system" to "X is a general property of UDEs" across three paragraphs.
    # The concrete, testable recommendation is what makes this worth writing: multiple trajectories from
    # different initial conditions / stimulus amplitudes, or a seed-spread check on the recovered
    # coefficients — the latter costs nothing and would have caught this here. Recommend the diagnostic,
    # not the conclusion.

  - id: single-trajectory-is-the-binding-limitation
    statement: >-
      The binding limitation of this work is that all conclusions rest on one trajectory; the natural
      next experiment is whether multiple trajectories spanning different initial conditions and
      stimulus amplitudes restore identifiability of the calcium conductance.
    section: discussion.limitations
    kind: interpretive
    evidence:
      - macro: SymbolicAHat
      - macro: RetrainAHat
    scope: >-
      one Iapp=10 uA/cm2, one steady-state IC at V0=-65 mV, one t in [0,100] ms window, 512 samples.
    guard: single-trajectory-scope
    status: retired
    # ===== RETIRED 2026-08-07. FALSIFIED BY OUR OWN CONTROL, which is the best possible reason.
    # The claim presumed the single trajectory was the binding constraint. It is not: a direct
    # two-parameter fit of (gCa, ECa) to that SAME trajectory recovers the conductance to 2.09 +/- 0.13
    # against a true 2.0, with a profile-likelihood 95% CI of [1.6065, 2.1477] and a Gauss-Newton relative
    # standard error of 6.7%. One trajectory is sufficient to identify the conductance.
    # The binding limitation is the FLEXIBILITY OF THE CLOSURE. Superseded by
    # closure-induced-nonidentifiability (the mechanism) and parametric-fit-identifies-conductance
    # (the evidence). Limitations must now name a different next experiment: not "would more
    # trajectories help?" but "which closure restrictions restore identifiability?".
    # The one part of the old scope that survives is unrelated to the thesis and has been moved to
    # seeds-confound-init-and-noise: seeds jointly redraw network init and OU noise, so the reported
    # spread cannot be decomposed. =====

  - id: parametric-fit-identifies-conductance
    statement: >-
      Fitting only the two calcium parameters (gCa, ECa) directly to the same single noisy trajectory,
      with the true functional form known and no neural network, recovers the conductance to about six
      per cent across seeds — so the data do determine the calcium conductance.
    section: results.parametric-identifiability
    kind: empirical
    evidence:
      - macro: ParamFitGcaHatTwo
      - macro: ParamFitGcaHatRangeTwo
      - macro: ParamFitGcaHatPointFour
      - macro: CondRelSeGcaTwo
      - macro: ParamFitChiSqPerPointTwo
      - figure: figures/fig13_parametric_identifiability.png
    scope: >-
      Same data as the UDE runs: gCa in {0.4,1.0,2.0,4.0}, OU noise 0.02, train t<=30 ms, true
      steady-state IC, n=5 seeds. Multi-start Nelder-Mead on a chi-square weighted by the KNOWN
      per-channel noise SD; start points deliberately exclude the truth. chi2/point = 0.994, i.e. the
      fit sits at the noise floor. Three independent diagnostics agree on the precision: observed seed
      spread 6.2%, profile-likelihood 95% CI [1.63, 2.13], asymptotic relative SE 6.7%. At gCa=0.4 the
      fit still recovers (0.438 +/- 0.065) though four times less precisely, and there ECa's profile CI
      runs into the grid edge, so ECa alone IS practically non-identifiable at low conductance.
      *** THE CLOSURE COLUMN OF Table tab:parametric IS NOT n=5 THROUGHOUT. *** At gCa=0.4 it is a
      SINGLE seed (1111): SymbolicAHatTrajTrainPointFour = -0.061 on the supervised trajectory, and its
      convex-hull reading of the same run is SymbolicAHatNegControl = -0.372. The symbolic pipeline was
      repeated over five seeds only at gCa=2.0, so that cell carries no spread; the caption marks it
      with a dagger and the n=5 in the caption is qualified accordingly.
    status: supported
    # ===== THE PAPER'S POSITIVE CONTROL. The old draft conceded in Limitations that it had none. =====
    # MANDATORY CAVEAT, must appear wherever this claim is used: a 2-parameter model handed the true
    # functional form is EXPECTED to beat a 337-parameter closure handed no form at all, and it also
    # forecasts about twice as well (0.123 vs 0.245 mV). So this is NOT "two equally good fits
    # disagree". The licensed inference is one-directional and that is enough: because the data
    # support the parameter to +/-6%, the closure's +/-57% cannot be blamed on the data.
    # Methodological note that must survive editing: the FIM is built from FIRST-order sensitivities
    # (Gauss-Newton) in LOG parameters. A finite-difference Hessian of the chi-square is unusable here
    # — spike-phase sensitivity makes it return an implied relative SE of 3e-5, contradicted by both
    # the profile and the seed spread.

  - id: closure-induced-nonidentifiability
    statement: >-
      The non-identifiability documented in this paper is introduced by the flexible neural closure
      rather than by the data: on identical data, parametric estimation of the calcium conductance is
      precise while estimation through the learned closure scatters by an order of magnitude more.
    section: discussion
    kind: interpretive
    evidence:
      - macro: ParamFitGcaHatTwo
      - macro: ParamFitGcaHatTwoSseFull
      - macro: SymbolicAHat
      - macro: SymbolicAHatTrajTrain
      - macro: ParamFitGcaHatPointFour
    scope: >-
      One system, one trajectory, one closure architecture (2->16->16->1 tanh MLP, 337 parameters).
      Quantitatively: 2.092 +/- 0.130 parametric vs 1.596 +/- 0.905 through the closure at gCa=2.0
      (a ~7x ratio of relative spreads), and 0.438 +/- 0.065 vs a WRONG-SIGNED -0.372 at gCa=0.4.
      We do not claim this holds for every closure, every architecture, or every system; we claim it
      happened here, under a controlled comparison in which the data were held fixed. Whether smaller
      or more constrained closures interpolate between the two regimes is untested.
      CONFOUND, NOW MEASURED (2026-08-20) -- it is no longer a caveat, and must not be restated as
      one. The DATA are held fixed, but the REPRESENTATION was never the only thing that changed:
      the parametric arm minimises the noise-weighted chi-square (identifiability_parametric.jl:117)
      by multi-start Nelder-Mead (identifiability_parametric.jl:129,137), while the UDE minimises
      the unweighted native-units SSE (src/experiment.jl:185), which is 99.97% voltage, by
      Adam + BFGS under a continuous adjoint (src/experiment.jl:126,133).
      parametric_matched_objective.jl now repeats the IDENTICAL two-parameter fit -- same data, same
      true form, same starts, same solver -- under the UDE's own objective, and gets
      2.478 +/- 0.489 (19.7%) against 2.092 +/- 0.130 (6.2%) under the likelihood
      (ParamFitGcaHatTwoSseFull). Its self-test re-fits the chi-square row through the same code
      path and reproduces parametric_fit.csv with worst relative disagreement exactly 0, so the sole
      variable is the objective. DECOMPOSITION, and this is the licensed one: objective ~3.2x
      (6.2 -> 19.7%), representation ~2.1x (19.7 -> 40.9%). Quote the ~2x figure for the
      representation, NEVER the ~6-7x ratio, which is objective and representation compounded. The
      one-directional inference is untouched and remains the load-bearing part: some estimator
      recovers gCa to 6% from this single trajectory, so the information IS in the data and the
      closure's scatter cannot be blamed on the data. The same run at every other gCa setting shows
      the same direction (0.4: 14.9 vs 37.3%; 1.0: 8.1 vs 26.4%; 4.0: 2.9 vs 12.9%), and the
      voltage-only objective agrees with the full-state one to three decimals, which independently
      corroborates LossShareV.
    status: supported
    # ===== THE THESIS OF THE REVISED PAPER. This is the parametric-vs-functional identifiability
    # distinction of Loman/Browning/Baker (arXiv 2606.30289) measured empirically: parametric
    # identifiability holds, functional identifiability fails. Cite them and norden2025structural here.
    # The claim is INTERPRETIVE, not empirical — the two numbers are facts, the causal attribution is
    # an inference licensed by the fact that the data were identical. Keep it labelled as such.

  - id: node-failure-is-architecture-not-budget
    statement: >-
      The black-box neural ODE's forecasting failure is caused by its architecture, not by an unequal
      optimisation budget: matching the UDE's budget does not help at all, while removing the raw time
      input from the right-hand side of an autonomous system improves the usable forecast horizon by
      more than an order of magnitude.
    section: results.forecasting
    kind: empirical
    evidence:
      - macro: NodeParityTimeRollout
      - macro: NodeParityTimeVRmse
      - macro: NodeParityAutoRollout
      - macro: NodeParityAutoVRmseMedian
    scope: >-
      gCa=2.0, OU noise 0.02, train t<=30 ms, n=5 seeds per variant, forecast window. Budget control:
      same architecture as published at Adam 5000/BFGS 300 gives rollout 0.431 +/- 0.446 ms (published
      0.548 +/- 0.655) and V RMSE 7119 +/- 4206 (published 3951 +/- 3561) — i.e. no better, slightly
      worse. Architecture control: same budget without the time input gives rollout 19.53 +/- 17.75 ms
      and a MEDIAN V RMSE of 16.88 mV. Per-seed rollouts 6.65/44.42/32.29/5.48/8.81 ms; 4 of 5 seeds
      have exactly correct spike counts, 1 (seed 4444) still fails outright at 294.8 mV. No test.
    guard: node-no-meanstd
    status: supported
    # Report the MEDIAN V RMSE, never the mean: the mean (73.2 +/- 124) is one bad seed. The old
    # "impossible versus routine" framing is dead. Two honest contrasts remain and both are strong:
    # MAGNITUDE (UDE 0.245 mV vs median 16.88, ~70x) and RELIABILITY (UDE saturates the 70 ms cap on
    # every seed with sd 0.028; the autonomous NODE ranges 5.5-44.4 ms and fails on 1 in 5).
    # Reliability is the sharper axis and was invisible while the baseline merely exploded.

  - id: retrain-improves-loss-worsens-recovery
    statement: >-
      Quadrupling the optimisation budget measurably improved the training objective while making every
      recovery quantity worse — the signature of optimisation along a direction the data do not
      constrain in the CLOSURE's parameter space, and along which further descent measurably degrades
      agreement with the true trajectory inside the training window itself. The single trajectory does
      determine the conductance (see parametric-fit-identifies-conductance); what the voltage leaves
      open is a direction of the 337-parameter closure, not the conductance itself.
    section: results.retrain
    kind: empirical
    evidence:
      - macro: TrainLossBefore
      - macro: TrainLossAfter
      - macro: RetrainAHat
      - macro: RetrainRTwoCondTrue
      - macro: UdeTrainVRmse
      - macro: RetrainTrainVRmse
    scope: >-
      gCa=2.0 full-state, n=5 seeds, identical model/data/seeds/solver/tolerances/loss; only the
      iteration budget differs (Adam 5000/BFGS 300 -> 20000/1000). Training loss 35.71 +/- 1.81 ->
      29.66 +/- 2.66, a 17% reduction on the mean. The BEFORE loss was never recorded at training time
      and is recovered by rebuilding the exact objective and evaluating it at the saved parameters;
      the method is validated by recomputing the AFTER loss and matching the recorded value to a
      relative difference of 0.
      NO VALIDATION SPLIT AND NO EARLY-STOPPING CRITERION EXIST ANYWHERE IN THE CODEBASE:
      train_two_stage (src/experiment.jl:111-125) runs a fixed Adam-then-BFGS budget and its callback
      always returns false, and make_ude_loss (src/experiment.jl:172-187) scores only
      data_noisy[:, train_idx]; there is no regularisation term either. The control is therefore
      evidence about the OPTIMISER, not about generalisation: it cannot separate motion along a flat
      direction from over-fitting the noise realisation. Both readings give the same practical
      conclusion (training longer is not the repair), and the paper must not present the extra
      iterations as innocuous. Train-window V RMSE against the CLEAN trajectory rose
      0.148 +/- 0.045 -> 0.243 +/- 0.054 (UdeTrainVRmse -> RetrainTrainVRmse) while the objective
      fell. metrics_retrain.csv has NO V_rmse_vs_noisy column, so the retrain has no noise-floor twin
      of UdeTrainVRmseVsNoisy: no "below the noise floor" claim about the retrain is citable, and the
      objective evaluated at the true (gCa, ECa) is in no committed CSV at all -- do not quote one.
    status: supported
    # ===== ADDED 2026-08-07 (review point 1, final sentence: "the original and retrained runs should
    # also report directly comparable training losses"). This STRENGTHENS the retrain control.
    # The old framing — "the final losses are tight, so the optimiser converged" — understated it.
    # The optimiser did not merely converge, it demonstrably fit the training data BETTER by 17%
    # while a_hat moved further from truth and R^2 fell. "More optimisation did nothing" is now the
    # WRONG summary; "more optimisation bought a better fit and a worse closure" is the right one.

  - id: symbolic-domain-robustness
    statement: >-
      The coefficient scatter is not an artifact of the fitting domain: refitting the conductance form
      on the strictly supervised trajectory, on controlled neighbourhoods around it, and on the
      original convex hull returns the same estimate and the same spread.
    section: results.symbolic-recovery
    kind: empirical
    evidence:
      - macro: SymbolicAHatTrajTrain
      - macro: SymbolicAHatRangeTrajTrain
      - macro: SymbolicRTwoTrajTrain
      - macro: SymbolicCondTrajTrain
      - macro: SymbolicCondHull
    scope: >-
      gCa=2.0, n=5 seeds, six domains: the published convex hull (n~4424 grid points), epsilon-tubes
      at 0.02/0.05/0.10 in the network's own (V/100, s) input coordinates, the full 100 ms trajectory,
      and the supervised trajectory t<=30 ms (n=154). a_hat means run 1.36-1.65 with sds 0.50-0.90
      across all six. The domains OVERLAP rather than nest: the tubes nest in one another but not
      in the hull (the widest keeps 5663 of 6400 grid points against the hull's 4424, with 1647 of
      those outside the hull), and the two trajectory domains are probe points, not grid subsets.
      The reimplementation reproduces the published hull fit to 1e-15, so the comparison is
      like-for-like.
    status: supported
    # ===== ADDED 2026-08-07 (review point 3). The objection was sound: a limit cycle's convex-hull
    # INTERIOR is never visited, so hull values are extrapolation dressed as interpolation. Conceded
    # in full — and the conclusion is unchanged, which is why conceding costs nothing.
    # ALSO CORRECTS A MIS-STATED JUSTIFICATION in the earlier draft. "Fitting on the trajectory alone
    # fails because the limit cycle is near-collinear" is UNMEASURED for the SIX-term SINDy library
    # (nothing in the repo computes a six-column condition number; symbolic_domain_comparison.py:107
    # does the 2x2 Gram only, so the "~25k trajectory / ~14k hull" figures asserted here until
    # 2026-08-20 had no source and were removed) and FALSE of the two-term conductance form (cond
    # 102.4 vs 69.9 — both benign, and the trajectory fit is if anything slightly better). Move the
    # headline conductance result onto the supervised trajectory; keep the hull only for SINDy.

  - id: seeds-confound-init-and-noise
    statement: >-
      Because each seed redraws the network initialisation and the noise realisation together, every
      reported spread is a joint init-and-data spread and the two sources cannot be separated from
      these runs.
    section: discussion.limitations
    kind: interpretive
    evidence:
      - macro: UdeForecastVRmse
      - macro: SymbolicAHat
    scope: >-
      Applies to every mean +/- sd in the paper. A fixed-data / varying-init run would separate them
      and does not exist in this project.
    status: supported
    # Split out of the retired single-trajectory-is-the-binding-limitation, whose thesis died but
    # whose seed-confound observation is independent of it and still true.
